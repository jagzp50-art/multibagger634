<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sovereign Research Terminal</title>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/recharts/umd/Recharts.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg0:#f4f6fb;--bg1:#ffffff;--bg2:#f8f9fc;--bg3:#eef0f5;--bg4:#e2e5ed;
  --wire:rgba(0,0,0,.08);--wire2:rgba(0,0,0,.12);--wire3:rgba(0,0,0,.18);
  --t0:#111827;--t1:#1f2937;--t2:#6b7280;--t3:#9ca3af;
  --acid:#16a34a;--acid-d:rgba(22,163,74,.08);--acid-g:0 0 12px rgba(22,163,74,.15);
  --rose:#dc2626;--rose-d:rgba(220,38,38,.08);
  --gold:#d97706;--gold-d:rgba(217,119,6,.08);
  --sky:#2563eb;--sky-d:rgba(37,99,235,.08);
  --purple:#7c3aed;--purple-d:rgba(124,58,237,.08);
  --sidebar-bg:#0f172a;--sidebar-t1:#e2e8f0;--sidebar-t2:#94a3b8;--sidebar-t3:#64748b;--sidebar-wire:rgba(255,255,255,.08);
  --mono:'JetBrains Mono',monospace;--sans:'Inter',system-ui,-apple-system,sans-serif;
  --card-radius:12px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg0);color:var(--t1);font-family:var(--sans);font-size:13px;-webkit-font-smoothing:antialiased}
#root{display:flex;flex-direction:column;height:100vh;overflow:hidden}

/* ── TOP NAV ── */
.topnav{display:flex;align-items:center;padding:0 20px;height:52px;background:#ffffff;border-bottom:1px solid var(--wire);flex-shrink:0;z-index:10}
.topnav-brand{display:flex;align-items:center;gap:10px;padding-right:16px;margin-right:8px;border-right:1px solid var(--wire);flex-shrink:0}
.topnav-sigma{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#7c3aed,#2563eb);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:#fff}
.topnav-wordmark{font-weight:800;font-size:14px;letter-spacing:1.5px;color:var(--t0)}
.topnav-sub{font-family:var(--mono);font-size:8px;color:var(--t3);letter-spacing:1px;text-transform:uppercase}
.topnav-tabs{display:flex;gap:2px;flex:1;padding:0 8px;overflow-x:auto}
.topnav-tab{padding:0 14px;height:52px;display:flex;align-items:center;font-family:var(--mono);font-size:10px;font-weight:500;color:var(--t2);border-bottom:2px solid transparent;transition:all .15s;white-space:nowrap;cursor:pointer;background:none;border-top:none;border-left:none;border-right:none}
.topnav-tab:hover{color:var(--t0);border-bottom-color:var(--wire2)}
.topnav-tab.active{color:var(--purple);border-bottom-color:var(--purple);font-weight:600}
.topnav-right{display:flex;align-items:center;gap:10px;padding-left:14px;border-left:1px solid var(--wire);flex-shrink:0;font-family:var(--mono);font-size:9px;color:var(--t2)}

/* ── TICKER STRIP ── */
.ticker-strip{display:flex;gap:0;overflow-x:auto;background:#ffffff;border-bottom:1px solid var(--wire);flex-shrink:0;height:40px;scrollbar-width:none}
.ticker-strip::-webkit-scrollbar{display:none}
.ticker-item{display:flex;align-items:center;gap:8px;padding:0 16px;border-right:1px solid var(--wire);white-space:nowrap;cursor:pointer;transition:background .15s}
.ticker-item:hover{background:var(--bg2)}
.ticker-sym{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--t0)}
.ticker-price{font-family:var(--mono);font-size:11px;color:var(--t1)}
.ticker-chg{font-family:var(--mono);font-size:10px;font-weight:600}
.ticker-chg.up{color:var(--acid)}.ticker-chg.dn{color:var(--rose)}

/* ── MAIN LAYOUT ── */
.main-layout{display:flex;flex:1;overflow:hidden}

/* ── SIDEBAR ── */
.sidebar{width:220px;min-width:220px;background:var(--sidebar-bg);border-right:1px solid var(--sidebar-wire);display:flex;flex-direction:column;overflow-y:auto;flex-shrink:0}
.sidebar-section{padding:14px 14px 10px;border-bottom:1px solid var(--sidebar-wire)}
.sidebar-label{font-family:var(--mono);font-size:8px;font-weight:600;letter-spacing:1.2px;color:var(--sidebar-t3);text-transform:uppercase;margin-bottom:8px}
.sidebar-item{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;cursor:pointer;transition:all .15s;font-size:12px;color:var(--sidebar-t2);margin-bottom:2px}
.sidebar-item:hover{background:rgba(255,255,255,.06);color:var(--sidebar-t1)}
.sidebar-item.active{background:rgba(124,58,237,.18);color:#a78bfa;font-weight:600}
.sidebar-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.sidebar-dot.green{background:#22c55e;box-shadow:0 0 6px rgba(34,197,94,.5)}
.sidebar-dot.red{background:#ef4444;box-shadow:0 0 6px rgba(239,68,68,.5)}
.sidebar-dot.amber{background:#f59e0b;box-shadow:0 0 6px rgba(245,158,11,.5)}
.sidebar-dot.blue{background:#3b82f6;box-shadow:0 0 6px rgba(59,130,246,.5)}
.sidebar-regime-badge{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;font-family:var(--mono);font-size:11px;font-weight:700;margin-top:4px}
.sidebar-regime-badge.BULL{background:rgba(34,197,94,.15);color:#22c55e}
.sidebar-regime-badge.BEAR{background:rgba(239,68,68,.15);color:#ef4444}
.sidebar-regime-badge.SIDEWAYS{background:rgba(245,158,11,.15);color:#f59e0b}
.sidebar-regime-badge.HIGH_VOLATILITY{background:rgba(239,68,68,.15);color:#ef4444}
.sidebar-exec{padding:10px 14px;border-bottom:1px solid var(--sidebar-wire)}
.sidebar-exec select{width:100%;background:rgba(255,255,255,.06);border:1px solid var(--sidebar-wire);color:var(--sidebar-t1);border-radius:6px;font-family:var(--mono);font-size:10px;padding:6px 8px;margin-bottom:6px;outline:none}
.sidebar-exec select:focus{border-color:rgba(124,58,237,.5)}
.sidebar-range{padding:10px 14px}
.sidebar-range label{font-family:var(--mono);font-size:8px;color:var(--sidebar-t3);display:block;margin-bottom:4px}
.sidebar-range input[type=range]{width:100%;accent-color:#7c3aed}
.sidebar-range-val{font-family:var(--mono);font-size:10px;color:var(--sidebar-t2);display:flex;justify-content:space-between}

/* ── CONTENT AREA ── */
.content{flex:1;overflow-y:auto;padding:0}
.content-scroll{padding:20px 24px;max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:16px}

/* ── CARDS (light theme) ── */
.card{background:#ffffff;border:1px solid var(--wire);border-radius:var(--card-radius);padding:16px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.card-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.card-title{font-family:var(--mono);font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:1.2px;color:var(--t2);display:flex;align-items:center;gap:8px}
.card-title::before{content:'';width:10px;height:1px;background:var(--purple)}

.screen-title{font-family:var(--sans);font-size:22px;font-weight:800;color:var(--t0);letter-spacing:.3px}
.screen-sub{font-family:var(--mono);font-size:9px;color:var(--t3);margin-top:2px;text-transform:uppercase;letter-spacing:1px}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
@media(max-width:1100px){.grid4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:900px){.grid2,.grid3,.grid4{grid-template-columns:1fr}}

table{width:100%;border-collapse:collapse;font-size:11px}
th{font-family:var(--mono);font-size:8px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.8px;text-align:left;padding:8px 10px;border-bottom:1px solid var(--wire);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid rgba(0,0,0,.04);color:var(--t1);white-space:nowrap}
tr:hover td{background:rgba(0,0,0,.02)}
.tbl-wrap{overflow-x:auto}
.num{font-family:var(--mono);text-align:right}
.up{color:var(--acid)}.dn{color:var(--rose)}.warn{color:var(--gold)}

.badge{font-family:var(--mono);font-size:8px;font-weight:700;padding:2px 7px;border-radius:3px;text-transform:uppercase;letter-spacing:.3px}
.badge-MULTIBAGGER{background:var(--acid-d);color:var(--acid);border:1px solid rgba(22,163,74,.2)}
.badge-STRONG{background:var(--gold-d);color:var(--gold);border:1px solid rgba(217,119,6,.2)}
.badge-EMERGING{background:var(--sky-d);color:var(--sky);border:1px solid rgba(37,99,235,.2)}
.badge-WATCHLIST{background:var(--bg3);color:var(--t3);border:1px solid var(--wire)}
.rule{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:8px;font-weight:600;padding:2px 6px;border-radius:3px;margin:1px}
.rule.pass{background:var(--acid-d);color:var(--acid)}
.rule.fail{background:var(--bg3);color:var(--t3)}
.rule.fail::before{content:'✕';color:var(--rose)}
.rule.pass::before{content:'✓'}

.sc-bar{display:inline-block;width:46px;height:3px;background:var(--bg3);border-radius:2px;overflow:hidden;vertical-align:middle;margin-right:6px}
.sc-fill{height:100%;border-radius:2px}
.btn{padding:8px 18px;border-radius:8px;background:linear-gradient(135deg,var(--purple) 0%,#6d28d9 100%);color:#ffffff;font-family:var(--mono);font-size:10px;font-weight:700;border:none;cursor:pointer;transition:all .2s}
.btn:hover{box-shadow:0 4px 12px rgba(124,58,237,.25);transform:translateY(-1px)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn-ghost{padding:7px 14px;border-radius:8px;border:1px solid var(--wire2);background:transparent;color:var(--t2);font-family:var(--mono);font-size:10px;font-weight:600;cursor:pointer;transition:all .15s}
.btn-ghost:hover{background:var(--bg3);color:var(--t1);border-color:var(--wire3)}
.btn-danger{padding:4px 10px;border-radius:6px;border:1px solid rgba(220,38,38,.3);background:transparent;color:var(--rose);font-family:var(--mono);font-size:9px;cursor:pointer}
.btn-danger:hover{background:var(--rose-d)}

input,select{background:var(--bg2);border:1px solid var(--wire2);color:var(--t0);border-radius:8px;font-family:var(--mono);font-size:10px;padding:7px 10px;outline:none;transition:border .15s}
input:focus,select:focus{border-color:var(--purple);box-shadow:0 0 0 3px var(--purple-d)}
input::placeholder{color:var(--t3)}
label{font-family:var(--mono);font-size:8px;color:var(--t3);text-transform:uppercase;letter-spacing:.8px;display:flex;flex-direction:column;gap:5px}
.filter-row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.filter-row>label{min-width:110px;flex:1}

.stat{display:flex;flex-direction:column;gap:4px}
.stat-val{font-family:var(--mono);font-size:22px;font-weight:600;color:var(--t0)}
.stat-key{font-family:var(--mono);font-size:8px;color:var(--t3);text-transform:uppercase;letter-spacing:1px}
.stat-val.acid{color:var(--acid)}.stat-val.rose{color:var(--rose)}.stat-val.gold{color:var(--gold)}

.alloc{display:flex;height:34px;border-radius:8px;overflow:hidden;border:1px solid var(--wire);font-family:var(--mono);font-size:10px;font-weight:600}
.alloc>div{display:flex;align-items:center;justify-content:center}
.alloc .eq{background:linear-gradient(135deg,rgba(22,163,74,.15),rgba(22,163,74,.08));color:var(--acid)}
.alloc .cs{background:var(--bg3);color:var(--t2)}

.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:40px 20px;text-align:center}
.empty-icon{font-size:30px;opacity:.35}
.empty-txt{font-family:var(--mono);font-size:11px;color:var(--t3)}
.loading-dot{display:inline-block;width:4px;height:4px;border-radius:50%;background:var(--purple);animation:pulse 1.4s ease-in-out infinite}
.loading-dot:nth-child(2){animation-delay:.2s}.loading-dot:nth-child(3){animation-delay:.4s}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(1.3)}}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.anim{animation:rise .3s ease both}
.note{font-family:var(--mono);font-size:9px;color:var(--t3);line-height:1.6}
.status-line{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:10px;color:var(--t2)}
.pulse-dot{width:6px;height:6px;border-radius:50%;background:var(--acid);box-shadow:0 0 8px rgba(22,163,74,.4);animation:pulse 1.2s infinite}

/* ── MARKET HEALTH HERO ── */
.health-hero{background:linear-gradient(135deg,#fafbff 0%,#f0f4ff 100%);border:1px solid rgba(124,58,237,.1);border-radius:14px;padding:24px 28px;display:flex;align-items:center;gap:28px;overflow:hidden}
.health-hero-left{display:flex;flex-direction:column;gap:4px}
.health-hero-label{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:2px;color:var(--t2);text-transform:uppercase}
.health-hero-score{font-family:var(--sans);font-size:72px;font-weight:800;line-height:1;background:linear-gradient(135deg,#7c3aed,#2563eb);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.health-hero-bar{width:340px;height:12px;background:var(--bg3);border-radius:6px;overflow:hidden;margin-top:8px}
.health-hero-fill{height:100%;border-radius:6px;background:linear-gradient(90deg,#7c3aed,#3b82f6);transition:width .8s ease}
.health-hero-right{display:flex;flex-direction:column;gap:6px;margin-left:auto}
.health-hero-stat{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:13px;font-weight:600}
.health-hero-stat .green{color:var(--acid)}.health-hero-stat .red{color:var(--rose)}

/* ── COMMAND CENTER ── */
.cmd-row{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
@media(max-width:900px){.cmd-row{grid-template-columns:repeat(3,1fr)}}
.cmd-card{background:#ffffff;border:1px solid var(--wire);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.cmd-card-label{font-family:var(--mono);font-size:8px;font-weight:600;letter-spacing:1px;color:var(--t3);text-transform:uppercase}
.cmd-card-value{font-family:var(--mono);font-size:14px;font-weight:700;color:var(--t0)}
.cmd-card-value.green{color:var(--acid)}.cmd-card-value.purple{color:var(--purple)}

/* ── METRIC CARDS (regime/breadth/sector/cash) ── */
.metric-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:900px){.metric-row{grid-template-columns:repeat(2,1fr)}}
.metric-card{background:#ffffff;border:1px solid var(--wire);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.metric-card-header{display:flex;align-items:center;justify-content:space-between}
.metric-card-title{font-family:var(--mono);font-size:8px;font-weight:600;letter-spacing:1px;color:var(--t3);text-transform:uppercase}
.metric-card-icon{width:20px;height:20px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:10px}
.metric-card-main{font-family:var(--mono);font-size:15px;font-weight:700;color:var(--t0)}
.metric-card-sub{font-family:var(--mono);font-size:9px;color:var(--t3)}

/* ── REGIME CHIPS ── */
.regime-chip{font-family:var(--mono);font-size:9px;font-weight:600;padding:3px 9px;border-radius:4px;display:inline-flex;align-items:center;gap:5px}
.regime-BULL{background:var(--acid-d);color:var(--acid)}
.regime-BEAR{background:var(--rose-d);color:var(--rose)}
.regime-SIDEWAYS{background:var(--gold-d);color:var(--gold)}
.regime-HIGH_VOLATILITY{background:var(--rose-d);color:var(--rose)}
.vix-pill{display:flex;align-items:center;gap:6px;padding:4px 10px;border-radius:20px;background:var(--bg3);border:1px solid var(--wire);font-family:var(--mono);font-size:10px}
.vix-dot{width:5px;height:5px;border-radius:50%}
.vix-dot.safe{background:var(--acid);box-shadow:0 0 6px rgba(22,163,74,.4)}
.vix-dot.warn{background:var(--gold);box-shadow:0 0 6px rgba(217,119,6,.4)}
.vix-dot.risk{background:var(--rose);box-shadow:0 0 6px rgba(220,38,38,.4)}
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const {useState, useEffect, useCallback, useMemo, useRef} = React;
const {LineChart,Line,XAxis,YAxis,Tooltip,ResponsiveContainer,ReferenceDot,Legend} = Recharts;

const API = '';
const SCORE_COLOR = s => s >= 75 ? '#16a34a' : s >= 55 ? '#d97706' : '#dc2626';
const fmt = (v, d=2) => v == null || isNaN(v) ? '—' : Number(v).toLocaleString('en-IN',{maximumFractionDigits:d});
const pct = v => v == null || isNaN(v) ? '—' : (v > 0 ? '+' : '') + Number(v).toFixed(1) + '%';
const fmtCr = v => v == null || isNaN(v) ? '—' : '₹' + Number(v).toLocaleString('en-IN',{maximumFractionDigits:0}) + ' Cr';
const fmtRs = v => v == null || isNaN(v) ? '—' : '₹' + Number(v).toLocaleString('en-IN',{maximumFractionDigits:2});

async function j(url, opts) {
  const r = await fetch(API + url, opts);
  if (!r.ok) throw new Error((await r.json().catch(()=>({}))).detail || `${r.status}`);
  return r.json();
}

function ScoreCell({score}){
  const c = SCORE_COLOR(score);
  return <span><span className="sc-bar"><span className="sc-fill" style={{width:(score||0)+'%',background:c,display:'block'}}/></span><span style={{fontFamily:'var(--mono)',fontWeight:600,color:c}}>{fmt(score,0)}</span></span>;
}
function Delta({v, suffix=''}){
  if (v == null || isNaN(v)) return <span style={{color:'var(--t3)',fontFamily:'var(--mono)'}}>—</span>;
  if (v === 0) return <span style={{color:'var(--t3)',fontFamily:'var(--mono)'}}>•</span>;
  const c = v > 0 ? 'var(--acid)' : 'var(--rose)';
  return <span className="num" style={{color:c,fontFamily:'var(--mono)',fontWeight:600}}>{v > 0 ? '▲' : '▼'} {v > 0 ? '+' : ''}{Number(v).toFixed(1)}{suffix}</span>;
}
function Bucket({b}){ return b ? <span className={`badge badge-${b}`}>{b}</span> : null; }
function ConfCell({v}){
  if (v == null || isNaN(v)) return <span style={{color:'var(--t3)',fontFamily:'var(--mono)'}}>—</span>;
  const c = v >= 80 ? 'var(--acid)' : v >= 60 ? 'var(--gold)' : 'var(--rose)';
  return <span style={{fontFamily:'var(--mono)',fontWeight:600,color:c}}>{fmt(v,0)}%</span>;
}
function Loader(){ return <div style={{display:'flex',gap:4,padding:'20px 0',justifyContent:'center'}}><span className="loading-dot"/><span className="loading-dot"/><span className="loading-dot"/></div>; }
function Empty({icon,text,children}){ return <div className="empty"><div className="empty-icon">{icon}</div><div className="empty-txt">{text}</div>{children}</div>; }

/* ── SIDEBAR ─────────────────────────────────────────────────────────── */
const SIGNAL_FILTERS = [
  {key:'ALL',label:'ALL SIGNALS',dot:'blue'},
  {key:'BUY_RATED',label:'BUY RATED',dot:'green'},
  {key:'WATCHLIST',label:'WATCH LIST',dot:'amber'},
  {key:'MULTIBAGGERS',label:'MULTIBAGGERS',dot:'green'},
  {key:'MICROCAPS',label:'MICROCAPS',dot:'amber'},
  {key:'LIQUIDITY',label:'LIQUIDITY',dot:'blue'},
  {key:'RECOVERY',label:'RECOVERY',dot:'blue'},
];
function Sidebar({tab,setTab,regime,signalFilter,setSignalFilter}){
  return (
    <aside className="sidebar">
      <div className="sidebar-section">
        <div className="sidebar-label">View</div>
        {SIGNAL_FILTERS.map(f=>(
          <div key={f.key} className={`sidebar-item${signalFilter===f.key?' active':''}`} onClick={()=>setSignalFilter(f.key)}>
            <span className={`sidebar-dot ${f.dot}`}/>
            <span>{f.label}</span>
          </div>
        ))}
      </div>
      <div className="sidebar-section">
        <div className="sidebar-label">Market Regime</div>
        {regime && regime.regime ? (
          <div className={`sidebar-regime-badge ${regime.regime}`}>
            <span className={`sidebar-dot ${regime.regime==='BULL'?'green':regime.regime==='BEAR'?'red':'amber'}`}/>
            {regime.regime}
          </div>
        ) : <div style={{color:'var(--sidebar-t3)',fontSize:10}}>Loading…</div>}
        {regime && regime.vix != null && (
          <div style={{marginTop:8,fontFamily:'var(--mono)',fontSize:10,color:'var(--sidebar-t2)'}}>
            VIX <span style={{color:'#f59e0b',fontWeight:600}}>{Number(regime.vix).toFixed(1)}</span>
          </div>
        )}
      </div>
      <div className="sidebar-exec">
        <div className="sidebar-label">Execution</div>

/* ── NAV (top) ────────────────────────────────────────────────────────── */
function Nav({tab,setTab,regime}){
  const tabs = ['Overview','Market Intelligence','Opportunities','Elite Picks','Discovery','Research','Regime','Ideas','Portfolio','Backtest'];
  const vix = regime && regime.vix;
  const vixClass = !vix ? 'warn' : vix >= 25 ? 'risk' : vix >= 20 ? 'warn' : 'safe';
  return (
    <nav className="topnav">
      <div className="topnav-brand">
        <div className="topnav-sigma">Σ</div>
        <div><div className="topnav-wordmark">SOVEREIGN</div><div className="topnav-sub">Research Terminal</div></div>
      </div>
      <div className="topnav-tabs">
        {tabs.map(t => <button key={t} className={`topnav-tab${tab===t?' active':''}`} onClick={()=>setTab(t)}>{t}</button>)}
      </div>
      <div className="topnav-right">
        {regime && regime.regime && <span className={`regime-chip regime-${regime.regime}`}>{regime.regime}</span>}
        {vix != null && <div className="vix-pill"><div className={`vix-dot ${vixClass}`}/><span style={{color:'var(--t3)',fontSize:'8px'}}>VIX</span><span style={{color:'var(--gold)',fontWeight:600}}>{Number(vix).toFixed(1)}</span></div>}
        <span style={{fontSize:14,cursor:'pointer',color:'var(--t2)'}}>⚙</span>
      </div>
    </nav>

}

/* ── TICKER STRIP ─────────────────────────────────────────────────────── */
function TickerStrip({topPicks,onSymbol}){
  if (!topPicks || topPicks.length === 0) return null;
  return (
    <div className="ticker-strip">
      {topPicks.slice(0,20).map(p=>(
        <div key={p.symbol} className="ticker-item" onClick={()=>onSymbol && onSymbol(p.symbol)}>
          <span className="ticker-sym">{p.symbol.replace('.NS','')}</span>
          <span className="ticker-price">{fmtRs(p.price)}</span>
          <span className={`ticker-chg ${(p.change_pct||0)>=0?'up':'dn'}`}>{pct(p.change_pct)}</span>
        </div>
      ))}
    </div>
  );
}

  const [breakouts,setBreakouts] = useState(null);

    j('/api/delivery').then(setDelivery).catch(()=>{});
    setDelBusy(false);
  };
  const load = useCallback(()=>{
    j('/api/dashboard').then(setData).catch(e=>setErr(e.message));
    j('/api/sectors').then(setSectors).catch(()=>{});
    j('/api/data-quality').then(setQuality).catch(()=>{});
    j('/api/delivery').then(setDelivery).catch(()=>{});
    j('/api/research/breakouts').then(setBreakouts).catch(()=>{});
    j('/api/events?limit=20').then(d=>setEvents(d||[])).catch(()=>{});

  useEffect(load,[load]);

  const runScan = async (force, tier='core')=>{

/* ── EXPLAINABILITY DRAWER ───────────────────────────────────────────── */
const FACTOR_LABELS = [['quality','Quality'],['growth','Growth'],['momentum','Momentum'],['valuation','Valuation'],['risk','Risk'],['revision','Revision'],['rs_boost','RS Boost'],['sector_boost','Sector']];
function Explain({symbol,onClose}){
  const [d,setD] = useState(null);
  const [err,setErr] = useState(null);
  useEffect(()=>{ setD(null); setErr(null); j('/api/explain/'+symbol).then(setD).catch(e=>setErr(e.message)); },[symbol]);
  const hist = d ? (d.score_history||[]) : [];
  return (
    <>
      <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.3)',zIndex:60}} onClick={onClose}/>
      <div className="anim" style={{position:'fixed',top:0,right:0,bottom:0,width:390,maxWidth:'94vw',background:'#ffffff',borderLeft:'1px solid var(--wire)',zIndex:61,padding:18,overflowY:'auto',display:'flex',flexDirection:'column',gap:12,boxShadow:'-4px 0 24px rgba(0,0,0,.08)'}}>
        {err ? <Empty icon="⚠️" text={err}/> : !d ? <Loader/> : (
          <>
            <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',gap:10}}>
              <div>
                <div style={{fontSize:19,fontWeight:700,color:'var(--t0)'}}>{symbol.replace('.NS','')}</div>

            <div className="card" style={{padding:'10px 12px'}}>
              <div style={{fontSize:9,fontWeight:700,letterSpacing:'0.12em',color:'var(--t3)'}}>FACTOR CONTRIBUTIONS</div>

                  const c = v >= 0 ? 'var(--acid)' : 'var(--rose)';
                  return (
                    <div key={k} style={{display:'flex',alignItems:'center',gap:8}}>
                      <span style={{fontFamily:'var(--mono)',fontSize:9,color:'var(--t2)',width:74}}>{label}</span>

                      </div>
                      <span style={{fontFamily:'var(--mono)',fontSize:10,fontWeight:600,color:c,width:44,textAlign:'right'}}>{v>0?'+':''}{Number(v).toFixed(1)}</span>
                    </div>

                })}
              </div>
            </div>
            <div style={{display:'flex',flexDirection:'column',gap:6}}>
              {d.best_positive && <div style={{fontSize:10,color:'var(--acid)',fontFamily:'var(--mono)'}}>▲ {d.best_positive.label} <span style={{color:'var(--t3)'}}>· {d.best_positive.value>0?'+':''}{Number(d.best_positive.value).toFixed(1)} pts</span></div>}
              {d.best_negative && <div style={{fontSize:10,color:'var(--rose)',fontFamily:'var(--mono)'}}>▼ {d.best_negative.label} <span style={{color:'var(--t3)'}}>· {Number(d.best_negative.value).toFixed(1)} pts</span></div>}

              <div className="card" style={{padding:'10px 12px'}}>
                <div style={{fontSize:9,fontWeight:700,letterSpacing:'0.12em',color:'var(--t3)'}}>SCORE TRAIL · {hist.length} SCANS</div>

                </div>
              </div>
            )}
          </>
        )}
      </div>
    </>
  );
}

/* ── SCREENER ────────────────────────────────────────────────────────── */

              <td style={{color:"var(--t0)",fontWeight:600}}>{a.symbol.replace(".NS","")}</td>
              <td style={{color:"var(--t2)"}}>{a.sector}</td>
              <td className="num"><ScoreCell score={a.pos_score}/></td>
              <td><Bucket b={a.mb_bucket}/></td>
              <td className="num" style={{fontWeight:600}}>{a.weight_pct}%</td>
            </tr>))}</tbody>
          </table></div>
        )}
      </div>
      {alloc && alloc.portfolio_risk && alloc.portfolio_risk.n && (
        <div className="card">
          <div className="card-hdr"><span className="card-title">Portfolio Risk</span></div>
          <div style={{display:"flex",gap:28,flexWrap:"wrap",alignItems:"center"}}>
            <div className="stat"><span className={} style={{fontSize:22}}>{alloc.portfolio_risk.risk_grade}</span><span className="stat-key">Risk Grade</span></div>
            <div className="stat"><span className="stat-val">{alloc.portfolio_risk.portfolio_vol!=null?alloc.portfolio_risk.portfolio_vol+'%':'—'}</span><span className="stat-key">Portfolio Vol</span></div>
            <div className="stat"><span className="stat-val">{alloc.portfolio_risk.hhi}</span><span className="stat-key">HHI</span></div>
            <div className="stat"><span className="stat-val">{alloc.portfolio_risk.cash_pct}%</span><span className="stat-key">Cash</span></div>
          </div>
        </div>
      )}
    </div>
  );
}

/* ── BACKTEST ─────────────────────────────────────────────────────────── */
function Backtest(){
  const [params,setParams] = useState({years:"3",top_n:"10",initial:"1000000",stop:"0.20",cost:"0.25"});
  const [result,setResult] = useState(null);
  const [runs,setRuns] = useState([]);
  const [running,setRunning] = useState(false);
  const [err,setErr] = useState(null);
  useEffect(()=>{ j("/api/backtests?limit=5").then(setRuns).catch(()=>{}); },[]);
  const run = async ()=>{
    setRunning(true); setErr(null); setResult(null);
    try {
      const r = await j("/api/backtest",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({years:parseInt(params.years)||3,top_n:parseInt(params.top_n)||10,initial_capital:parseFloat(params.initial)||1000000,trailing_stop_pct:parseFloat(params.stop)||0.2,cost_pct:parseFloat(params.cost)||0.25})});
      setResult(r); j("/api/backtests?limit=5").then(setRuns).catch(()=>{});
    } catch(e){ setErr(e.detail||e.message); }
    finally{ setRunning(false); }
  };
  const set = k => e => setParams({...params,[k]:e.target.value});
  const s = result ? result.summary : null;
  const [wf,setWf] = useState(null);
  const [wfRunning,setWfRunning] = useState(false);
  const runWF = async ()=>{
    setWfRunning(true); setWf(null);
    try{ const r = await j("/api/backtest/walk-forward",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({fold_months:12,folds:3,top_n:parseInt(params.top_n)||10,initial_capital:parseFloat(params.initial)||1000000,trailing_stop_pct:parseFloat(params.stop)||0.2})}); setWf(r); }
    catch(e){} finally{ setWfRunning(false); }
  };
  return (
    <div className="content-scroll anim">
      <div><div className="screen-title">Backtest</div><div className="screen-sub">Momentum + trend · monthly rebalance · trailing stop · walk-forward</div></div>
      <div className="card"><div className="filter-row">
        <label>Years<input type="number" min="1" max="10" value={params.years} onChange={set("years")}/></label>
        <label>Top N<input type="number" min="1" max="30" value={params.top_n} onChange={set("top_n")}/></label>
        <label>Capital (₹)<input type="number" value={params.initial} onChange={set("initial")}/></label>
        <label>Stop %<input type="number" step="0.05" value={params.stop} onChange={set("stop")}/></label>
        <label>Cost %<input type="number" step="0.05" value={params.cost} onChange={set("cost")}/></label>
        <button className="btn" disabled={running} onClick={run}>{running?'Running…':'▶ Run'}</button>
        <button className="btn-ghost" disabled={running||wfRunning} onClick={runWF}>{wfRunning?'Running…':'⇄ Walk-Forward'}</button>
      </div></div>
      {err && <div className="note" style={{color:"var(--rose)",marginTop:10}}>{err}</div>}
      {result && s && !s.error && (<>
        <div className="grid3">
          <div className="card"><div className="stat"><span className={}>{pct(s.cagr_pct)}</span><span className="stat-key">CAGR</span></div></div>
          <div className="card"><div className="stat"><span className="stat-val rose">{Number(s.max_drawdown_pct).toFixed(1)}%</span><span className="stat-key">Max Drawdown</span></div></div>
          <div className="card"><div className="stat"><span className="stat-val gold">{Number(s.sharpe).toFixed(2)}</span><span className="stat-key">Sharpe</span></div></div>
          <div className="card"><div className="stat"><span className="stat-val">{s.win_rate_pct!=null?s.win_rate_pct+'%':'—'}</span><span className="stat-key">Win Rate</span></div></div>
          <div className="card"><div className="stat"><span className={}>{pct(s.net_return_pct)}</span><span className="stat-key">Net Return</span></div></div>
          <div className="card"><div className="stat"><span className="stat-val">{fmtRs(s.final_value)}</span><span className="stat-key">Final Value</span></div></div>
        </div>
        <div className="card">
          <div className="card-hdr"><span className="card-title">Equity Curve</span></div>
          {result.equity_curve.length > 2 ? (
            <div style={{height:280}}>
              <ResponsiveContainer width="100%" height="100%">
                <LineChart data={result.equity_curve} margin={{top:8,right:8,bottom:0,left:8}}>
                  <XAxis dataKey="date" tick={{fill:"var(--t3)",fontSize:9,fontFamily:"var(--mono)"}} axisLine={false} tickLine={false} minTickGap={40}/>
                  <YAxis domain={["auto","auto"]} tick={{fill:"var(--t3)",fontSize:9,fontFamily:"var(--mono)"}} axisLine={false} tickLine={false} width={70} tickFormatter={v=>v>=100000?'₹'+(v/100000).toFixed(0)+'L':'₹'+v}/>
                  <Tooltip contentStyle={{backgroundColor:"var(--bg1)",borderColor:"var(--wire)",borderRadius:8,fontSize:10,fontFamily:"var(--mono)"}}/>
                  <Line type="monotone" dataKey="equity" stroke="#7c3aed" strokeWidth={2} dot={false}/>
                </LineChart>
              </ResponsiveContainer>
            </div>
          ) : <Empty icon="📈" text="Need more history."/>}
        </div>
        {result.trades.length > 0 && (
          <div className="card">
            <div className="card-hdr"><span className="card-title">Trades ({result.trades.length})</span></div>
            <div className="tbl-wrap"><table>
              <thead><tr><th>Symbol</th><th>Entry</th><th>Exit</th><th className="num">Return</th><th>Reason</th></tr></thead>
              <tbody>{result.trades.slice(-20).reverse().map((t,i)=>(<tr key={i}>
                <td style={{color:"var(--t0)",fontWeight:600}}>{t.symbol.replace(".NS","")}</td>
                <td style={{fontFamily:"var(--mono)",color:"var(--t2)"}}>{t.entry_date}</td>
                <td style={{fontFamily:"var(--mono)",color:"var(--t2)"}}>{t.exit_date}</td>
                <td className={}>{pct(t.return_pct)}</td>
                <td><span className="badge badge-WATCHLIST" style={{fontSize:8}}>{t.reason}</span></td>
              </tr>))}</tbody>
            </table></div>
          </div>
        )}
      </>)}
      {wf && wf.summary && !wf.summary.error && (
        <div className="card">
          <div className="card-hdr"><span className="card-title">Walk-Forward · {wf.summary.folds_evaluated} folds</span></div>
          <div className="grid3">
            <div className="card"><div className="stat"><span className={}>{pct(wf.summary.avg_return_pct)}</span><span className="stat-key">Avg Return</span></div></div>
            <div className="card"><div className="stat"><span className="stat-val gold">{fmt(wf.summary.hit_rate_pct,0)}%</span><span className="stat-key">Hit Rate</span></div></div>
            <div className="card"><div className="stat"><span className="stat-val rose">{fmt(wf.summary.worst_max_drawdown_pct,1)}%</span><span className="stat-key">Worst DD</span></div></div>
          </div>
        </div>
      )}
    </div>
  );
}

/* ── APP ──────────────────────────────────────────────────────────────── */
function App(){
  const [tab,setTab] = useState("Overview");
  const [regime,setRegime] = useState(null);
  const [signalFilter,setSignalFilter] = useState("ALL");
  const [topPicks,setTopPicks] = useState([]);
  useEffect(()=>{ j("/api/regime").then(setRegime).catch(()=>{}); j("/api/dashboard").then(d=>setTopPicks(d.top_picks||[])).catch(()=>{}); },[]);
  const mapTab = t => {
    const m = {"Overview":"Dashboard","Market Intelligence":"Dashboard","Opportunities":"Screener","Elite Picks":"Elite Picks","Discovery":"Discovery","Research":"Research","Regime":"Research","Ideas":"Ideas","Portfolio":"Portfolio","Backtest":"Backtest"};
    return m[t] || "Dashboard";
  };
  const screen = mapTab(tab);
  return (
    <>
      <Nav tab={tab} setTab={setTab} regime={regime}/>
      <TickerStrip topPicks={topPicks}/>
      <div className="main-layout">
        <Sidebar tab={tab} setTab={setTab} regime={regime} signalFilter={signalFilter} setSignalFilter={setSignalFilter}/>
        <div className="content">
          {screen==='Dashboard' && <Dashboard signalFilter={signalFilter}/>}
          {screen==='Screener' && <Screener/>}
          {screen==='Elite Picks' && <ElitePicks/>}
          {screen==='Discovery' && <Discovery/>}
          {screen==='Research' && <Research/>}
          {screen==='Ideas' && <Ideas/>}
          {screen==='Portfolio' && <Portfolio/>}
          {screen==='Backtest' && <Backtest/>}
        </div>
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>

          <div className="tbl-wrap">
            <table>
              <thead><tr><th>Symbol</th><th>Quarter</th><th>Direction</th><th className="num">Revenue qoq</th><th className="num">PAT qoq</th><th></th></tr></thead>
              <tbody>
                {revs.slice(0,25).map((v,i)=>(
                  <tr key={i}>
                    <td style={{color:'var(--t0)',fontWeight:600}}>{v.symbol.replace('.NS','')}</td>
                    <td style={{fontFamily:'var(--mono)',color:'var(--t2)'}}>{v.period_end}</td>
                    <td><span className={`badge badge-${v.direction==='UPGRADE'?'MULTIBAGGER':v.direction==='DOWNGRADE'?'WATCHLIST':'EMERGING'}`}>{v.direction}</span></td>
                    <td className={`num ${v.revenue_qoq_pct!=null ? (v.revenue_qoq_pct>=0?'up':'dn') : ''}`}>{v.revenue_qoq_pct!=null ? pct(v.revenue_qoq_pct) : '—'}</td>
                    <td className={`num ${v.net_income_qoq_pct!=null ? (v.net_income_qoq_pct>=0?'up':'dn') : ''}`}>{v.net_income_qoq_pct!=null ? pct(v.net_income_qoq_pct) : '—'}</td>
                    <td>{v.is_first_seen ? <span className="badge badge-STRONG">NEW</span> : '—'}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
      </div>

      <div className="note" style={{opacity:0.7}}>Updated {fdata.updated ? new Date(fdata.updated).toLocaleString('en-IN') : '—'} · honest by design: empty until scans + elapsed history accumulate.</div>
    </div>
  );
}

/* ── PORTFOLIO ───────────────────────────────────────────────────────── */
const HOLDINGS_KEY = 'sovereign-lite-holdings';
function Portfolio(){
  const [holdings,setHoldings] = useState(()=>{ try { return JSON.parse(localStorage.getItem(HOLDINGS_KEY)||'[]'); } catch { return []; } });
  const [quotes,setQuotes] = useState({});
  const [universe,setUniverse] = useState([]);
  const [alloc,setAlloc] = useState(null);
  const [newSym,setNewSym] = useState('');
  const [qty,setQty] = useState('');
  const [avg,setAvg] = useState('');
  const [err,setErr] = useState(null);
  const [rebal,setRebal] = useState(null);
  const [rebalLoading,setRebalLoading] = useState(false);
  const [runs,setRuns] = useState([]);
  const [budgets,setBudgets] = useState({});
  const [budgetMsg,setBudgetMsg] = useState(null);

  const loadRebal = ()=>{
    setRebalLoading(true);
    j('/api/rebalance?top_n=8&mode=kelly&max_sector_weight=25', {method:'POST'}).then(setRebal).catch(()=>{}).finally(()=>setRebalLoading(false));
    j('/api/rebalance/runs?limit=6').then(setRuns).catch(()=>{});
  };
  const applyRun = async (id)=>{
    if (!confirm('Mark this plan as applied? The target book becomes the next baseline.')) return;
    try { await j('/api/rebalance/'+id+'/apply', {method:'POST'}); j('/api/rebalance/runs?limit=6').then(setRuns).catch(()=>{}); }
    catch(e){ alert(e.message || 'apply failed'); }
  };
  const saveBudgets = async ()=>{
    const cleaned = {};
    Object.entries(budgets).forEach(([k,v])=>{ const f = parseFloat(v); if (!isNaN(f) && f>0) cleaned[k]=f; });
    try {
      const r = await j('/api/sector-budgets', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(cleaned)});
      setBudgetMsg('Saved — '+(r.saved||0)+' budgets');
      setTimeout(()=>setBudgetMsg(null), 4000);
      j('/api/portfolio').then(setAlloc).catch(()=>{});
    } catch(e){ setBudgetMsg('Save failed: '+(e.message||'')); }
  };

  useEffect(()=>{ localStorage.setItem(HOLDINGS_KEY, JSON.stringify(holdings)); },[holdings]);
  useEffect(()=>{ j('/api/universe').then(u=>setUniverse(u.map(x=>x.symbol))).catch(()=>{}); },[]);
  useEffect(()=>{ j('/api/portfolio').then(setAlloc).catch(()=>{}); },[]);
  useEffect(()=>{ loadRebal(); },[]);
  useEffect(()=>{ if (alloc && alloc.sector_budgets) setBudgets(prev=>({...prev, ...alloc.sector_budgets})); },[alloc]);
  useEffect(()=>{
    if (!holdings.length) { setQuotes({}); return; }
    let live = true;
    (async()=>{
      const q = {};
      for (const h of holdings) {
        try { q[h.symbol] = await j('/api/quote/'+encodeURIComponent(h.symbol)); } catch { q[h.symbol] = null; }
      }
      if (live) setQuotes(q);
    })();
    return ()=>{ live = false; };
  },[holdings]);

  const add = (e)=>{
    e.preventDefault();
    let sym = newSym.trim().toUpperCase();
    if (!sym) return;
    if (!sym.endsWith('.NS') && !sym.endsWith('.BO')) sym += '.NS';
    const q = parseFloat(qty), a = parseFloat(avg);
    if (!q || q <= 0 || !a || a <= 0) return;
    setHoldings(h => [...h.filter(x=>x.symbol!==sym), {symbol:sym, qty:q, avg:a}]);
    setNewSym(''); setQty(''); setAvg('');
  };
  const remove = sym => setHoldings(h=>h.filter(x=>x.symbol!==sym));

  const rows = holdings.map(h=>{
    const q = quotes[h.symbol] || {};
    const ltp = q.price;
    const mv = ltp ? ltp*h.qty : null;
    const cost = h.avg*h.qty;
    const pnl = mv != null ? mv - cost : null;
    const pnlPct = pnl != null && cost ? pnl/cost*100 : null;
    return {...h, ltp, mv, cost, pnl, pnlPct, chg: q.change_pct};
  });
  const totCost = rows.reduce((s,r)=>s+r.cost,0);
  const totMv = rows.reduce((s,r)=>s+(r.mv||0),0);
  const totPnl = totMv - totCost;
  const totPct = totCost ? totPnl/totCost*100 : 0;

  return (
    <div className="wrap anim">
      <div><div className="screen-title">Portfolio</div><div className="screen-sub">Suggested allocation · holdings · P&L</div></div>

      <div className="card">
        <div className="card-hdr"><span className="card-title">Suggested Allocation</span><span className="note">Position score 40% Quality · 30% MB · 20% RS · 10% Risk · Kelly-Lite sizing (score × quality ÷ volatility)</span></div>
        {!alloc ? <Loader/> : alloc.allocation.length === 0 ? <div className="note">Run a scan first.</div> : (
          <div className="tbl-wrap">
            <table>
              <thead><tr>
                <th>#</th><th>Symbol</th><th>Sector</th><th className="num">Position Score</th><th>Bucket</th><th className="num">Weight</th><th style={{width:'40%'}}/>
              </tr></thead>
              <tbody>
                {alloc.allocation.map((a,i)=>(
                  <tr key={a.symbol}>
                    <td style={{color:'var(--t3)',fontFamily:'var(--mono)'}}>{i+1}</td>
                    <td style={{color:'var(--t0)',fontWeight:600}}>{a.symbol.replace('.NS','')}</td>
                    <td style={{color:'var(--t2)'}}>{a.sector}</td>
                    <td className="num"><ScoreCell score={a.pos_score}/></td>
                    <td><Bucket b={a.mb_bucket}/></td>
                    <td className="num" style={{fontFamily:'var(--mono)',fontWeight:600}}>{a.weight_pct}%</td>
                    <td><div style={{height:6,background:'var(--bg3)',borderRadius:4,overflow:'hidden'}}><div style={{height:'100%',width:Math.min(100,(a.weight_pct/(alloc.equity_pct||100))*100)+'%',background:'var(--acid)',borderRadius:4}}/></div></td>
                  </tr>
                ))}
              </tbody>
            </table>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16,marginTop:12}} className="grid2">
              <div>
                <div className="card-title" style={{marginBottom:8}}>Sector Weights · cap {alloc.max_sector_weight != null ? alloc.max_sector_weight : 25}%</div>
                <div style={{marginBottom:8}} className="note">Per-sector budgets (empty = global cap):</div>
                <div style={{display:'flex',flexDirection:'column',gap:5}}>
                  {Object.entries(alloc.sector_weights||{}).sort((a,b)=>b[1]-a[1]).map(([s,w])=>{
                    const cap = alloc.max_sector_weight || 25;
                    return (
                      <div key={s} style={{display:'flex',alignItems:'center',gap:8}}>
                        <span style={{fontFamily:'var(--mono)',fontSize:9,color:'var(--t2)',width:100}}>{s}</span>
                        <div style={{flex:1,height:6,background:'var(--bg3)',borderRadius:4,overflow:'hidden'}}>
                          <div style={{height:'100%',width:Math.min(100,w/cap*100)+'%',background:w>cap?'var(--rose)':'var(--sky)',borderRadius:4}}/>
                        </div>
                        <span style={{fontFamily:'var(--mono)',fontSize:10,fontWeight:600,color:w>cap?'var(--rose)':'var(--t1)',width:44,textAlign:'right'}}>{w}%</span>
                      </div>
                    );
                  })}
                </div>
                <div style={{display:'flex',gap:6,flexWrap:'wrap',marginTop:8}}>
                  {Object.keys(alloc.sector_weights||{}).map(sec=>(
                    <label key={sec} style={{display:'flex',alignItems:'center',gap:4,fontSize:9,fontFamily:'var(--mono)',color:'var(--t2)'}}>
                      {sec.replace(/ .*$/,'')}
                      <input type="number" min="0" max="40" step="1" value={budgets[sec]!=null ? budgets[sec] : ''}
                        placeholder={(alloc.max_sector_weight||25).toString()}
                        onChange={e=>setBudgets({...budgets, [sec]: e.target.value})}
                        style={{width:42,padding:'3px 5px',background:'var(--bg0)',border:'1px solid var(--wire)',borderRadius:5,color:'var(--t0)',fontFamily:'var(--mono)',fontSize:9}}/>
                    </label>
                  ))}
                  <button className="btn-ghost" style={{padding:'4px 10px',fontSize:9}} onClick={saveBudgets}>Save budgets</button>
                  {budgetMsg && <span style={{fontSize:9,color:'var(--acid)',fontFamily:'var(--mono)'}}>{budgetMsg}</span>}
                </div>
              </div>
              <div>
                <div className="card-title" style={{marginBottom:8}}>Factor Exposure</div>
                <div style={{display:'flex',flexWrap:'wrap',gap:8}}>
                  {['quality','growth','momentum','valuation','risk','mb_score','rs_rank'].map(f=>(
                    alloc.factor_exposure && alloc.factor_exposure[f]!=null ? (
                      <span key={f} className={`badge badge-${f==='momentum'?'MULTIBAGGER':f==='quality'?'STRONG':f==='risk'?'WATCHLIST':'EMERGING'}`} style={{fontSize:9,padding:'4px 8px'}}>{f.replace('_score','')}: {fmt(alloc.factor_exposure[f],0)}</span>
                    ) : null
                  ))}
                </div>
                {alloc.factor_exposure && alloc.factor_exposure.top_factor && (
                  <div className="note" style={{marginTop:8}}>Dominant factor: <b style={{color:'var(--gold)'}}>{alloc.factor_exposure.top_factor}</b> at {alloc.factor_exposure.top_factor_share}% of the factor mix — {alloc.factor_exposure.top_factor_share > 45 ? 'crowding risk, consider trimming.' : 'balanced enough.'}</div>
                )}
              </div>
            </div>
            <div className="note" style={{marginTop:8}}>Regime {alloc.regime} · {alloc.equity_pct}% equity deployment · Kelly-Lite 2.0 (score × quality ÷ volatility × drawdown-penalty) with {alloc.max_sector_weight != null ? alloc.max_sector_weight : 25}% sector cap.</div>
          </div>
        )}
      </div>

      <div className="card">
        <div className="card-hdr"><span className="card-title">Portfolio Risk</span><span className="note">weighted book risk · diversification-adjusted</span></div>
        {!alloc || !alloc.portfolio_risk || !alloc.portfolio_risk.n ? <div className="note">Run a scan first.</div> : (
          <div>
            <div style={{display:'flex',gap:28,flexWrap:'wrap',alignItems:'center'}}>
              <div className="stat"><span className={`stat-val ${alloc.portfolio_risk.risk_grade==='CONSERVATIVE'?'acid':alloc.portfolio_risk.risk_grade==='BALANCED'?'gold':'rose'}`} style={{fontSize:22}}>{alloc.portfolio_risk.risk_grade}</span><span className="stat-key">Risk Grade</span></div>
              <div className="stat"><span className="stat-val">{alloc.portfolio_risk.portfolio_vol!=null ? alloc.portfolio_risk.portfolio_vol+'%' : '—'}</span><span className="stat-key">Portfolio Vol (est.)</span></div>
              <div className="stat"><span className="stat-val">{alloc.portfolio_risk.avg_vol!=null ? alloc.portfolio_risk.avg_vol+'%' : '—'}</span><span className="stat-key">Avg Stock Vol</span></div>
              <div className="stat"><span className={`stat-val ${alloc.portfolio_risk.avg_max_dd!=null && alloc.portfolio_risk.avg_max_dd > -30 ? 'acid' : alloc.portfolio_risk.avg_max_dd!=null && alloc.portfolio_risk.avg_max_dd > -45 ? 'gold' : 'rose'}`}>{alloc.portfolio_risk.avg_max_dd!=null ? alloc.portfolio_risk.avg_max_dd+'%' : '—'}</span><span className="stat-key">Weighted Max Drawdown</span></div>
              <div className="stat"><span className="stat-val">{alloc.portfolio_risk.top1_share}%</span><span className="stat-key">Top-1 Weight</span></div>
              <div className="stat"><span className="stat-val">{alloc.portfolio_risk.top3_share}%</span><span className="stat-key">Top-3 Weight</span></div>
              <div className="stat"><span className="stat-val">{alloc.portfolio_risk.hhi}</span><span className="stat-key">HHI Concentration</span></div>
              <div className="stat"><span className="stat-val">{alloc.portfolio_risk.effective_n}</span><span className="stat-key">Effective Names</span></div>
              <div className="stat"><span className="stat-val">{alloc.portfolio_risk.avg_quality!=null ? alloc.portfolio_risk.avg_quality : '—'}</span><span className="stat-key">Avg Quality</span></div>
              <div className="stat"><span className="stat-val">{alloc.portfolio_risk.cash_pct}%</span><span className="stat-key">Cash</span></div>
            </div>
            <div className="note" style={{marginTop:12}}>{alloc.portfolio_risk.risk_grade==='CONSERVATIVE' ? 'Low-vol, diversified book — drawdown protection is the priority.' : alloc.portfolio_risk.risk_grade==='BALANCED' ? 'Moderate risk — volatility and drawdown within normal range.' : 'High-risk book — top names dominate; consider trimming or raising cash.'}</div>
          </div>
        )}
      </div>

      <div className="card">
        <div className="card-hdr"><span className="card-title">Tax-Aware Rebalancer</span><span className="note">last saved allocation → today's target book · HOLD inside tolerance · STCG/LTCG on realized gains</span>
          <button className="btn-ghost" style={{marginLeft:'auto'}} disabled={rebalLoading} onClick={loadRebal}>{rebalLoading ? 'Planning…' : '⟳ Recompute'}</button>
        </div>
        {!rebal ? <Loader/> : rebal.plan.n_prev === 0 ? (
          <div className="note">No previous allocation snapshot yet — run a scan and the current book becomes the baseline; the next rebalance plan diffs against it.</div>
        ) : (
          <div>
            <div style={{display:'flex',gap:24,flexWrap:'wrap',alignItems:'center',marginBottom:12}}>
              <div className="stat"><span className={`stat-val ${rebal.plan.turnover_pct<=25?'acid':rebal.plan.turnover_pct<=60?'gold':'rose'}`}>{rebal.plan.turnover_pct}%</span><span className="stat-key">Turnover</span></div>
              <div className="stat"><span className="stat-val rose">{fmtRs(rebal.plan.total_tax)}</span><span className="stat-key">Est. Tax ({rebal.plan.stcg_tax>0 ? 'STCG '+fmtRs(rebal.plan.stcg_tax)+' · ' : ''}{rebal.plan.ltcg_tax>0 ? 'LTCG '+fmtRs(rebal.plan.ltcg_tax)+' · ' : ''}realized gains)</span></div>
              <div className="stat"><span className="stat-val">{fmtRs(rebal.plan.cost_est)}</span><span className="stat-key">Costs (0.5% RT)</span></div>
              <div className="stat"><span className={`stat-val ${rebal.plan.total_drag_pct<=1.5?'acid':rebal.plan.total_drag_pct<=3.5?'gold':'rose'}`}>{rebal.plan.total_drag_pct}%</span><span className="stat-key">Total Drag (tax+cost)</span></div>
              <div className="stat"><span className="stat-val">{rebal.plan.n_prev} → {rebal.plan.n_target}</span><span className="stat-key">Book size</span></div>
            </div>
            {rebal.prev_scan_date && <div className="note" style={{marginBottom:8}}>Baseline from {rebal.prev_scan_date}{rebal.prev_mode ? ' · mode '+rebal.prev_mode : ''} — estimated gains use real entry vs current price.</div>}
            <div className="tbl-wrap">
              <table>
                <thead><tr><th>Symbol</th><th>Action</th><th className="num">Prev %</th><th className="num">Target %</th><th className="num">Notional</th><th className="num">Est. Gain</th><th className="num">Est. Tax</th><th>Why</th></tr></thead>
                <tbody>
                  {rebal.plan.trades.map(t=>(
                    <tr key={t.symbol}>
                      <td style={{color:'var(--t0)',fontWeight:600}}>{t.symbol.replace('.NS','')}</td>
                      <td><span className={`badge badge-${t.side==='SELL'?'WATCHLIST':t.side==='TRIM'?'EMERGING':t.side==='BUY'?'MULTIBAGGER':t.side==='ADD'?'STRONG':'ELITE'}`}>{t.side}</span></td>
                      <td className="num">{t.prev_pct}%</td>
                      <td className="num">{t.target_pct}%</td>
                      <td className="num">{t.notional>0 ? fmtRs(t.notional) : '—'}</td>
                      <td className={`num ${t.est_gain_pct!=null ? (t.est_gain_pct>=0?'up':'dn') : '—'}`}>{t.est_gain_pct!=null ? pct(t.est_gain_pct) : '—'}</td>
                      <td className="num">{t.est_tax>0 ? fmtRs(t.est_tax)+(t.tax_kind ? ' '+t.tax_kind : '') : '—'}</td>
                      <td style={{fontSize:10,color:'var(--t2)'}}>{t.reason}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
            <div className="note" style={{marginTop:8}}>Anti-churn by design: names still in top-N with drift under ±2% are HOLD — a winner is never sold just to be re-bought.</div>

            {rebal.plan.cash_plan && (
              <div style={{marginTop:12,padding:'10px 12px',background:'var(--bg2)',border:'1px solid var(--wire)',borderRadius:10}}>
                <div className="card-title" style={{fontSize:10,marginBottom:6}}>Cash Plan · {rebal.plan.cash_plan.target_cash_pct}% target cash ({rebal.plan.cash_plan.base_cash_pct}% regime + {rebal.plan.cash_plan.extra_buffer}% buffer)</div>
                {rebal.plan.cash_plan.reasons.map((r,i)=><div key={i} style={{fontFamily:'var(--mono)',fontSize:9,color:'var(--gold)'}}>▸ {r}</div>)}
                {rebal.plan.cash_plan.wait_for_pullback.length>0 && <div style={{fontFamily:'var(--mono)',fontSize:9,color:'var(--t2)',marginTop:4}}>Wait for pullback: {rebal.plan.cash_plan.wait_for_pullback.map(x=>x.replace('.NS','')).join(', ')} (RS≥95 but score<72)</div>}
                {rebal.plan.cash_plan.capped_liquidity.length>0 && <div style={{fontFamily:'var(--mono)',fontSize:9,color:'var(--t3)',marginTop:2}}>Thin liquidity, size carefully: {rebal.plan.cash_plan.capped_liquidity.map(x=>x.replace('.NS','')).join(', ')}</div>}
                <div style={{display:'flex',gap:14,marginTop:6,fontFamily:'var(--mono)',fontSize:9,color:'var(--t3)'}}>
                  {rebal.plan.cash_plan.deploy_schedule.map(d=>(
                    <span key={d.phase}>{d.phase}: {d.pct}% — {d.trigger}</span>
                  ))}
                </div>
              </div>
            )}

            <div style={{display:'flex',alignItems:'center',gap:10,marginTop:12}}>
              <button className="btn" style={{padding:'6px 14px',fontSize:10}} disabled={!rebal.run_id} onClick={()=>applyRun(rebal.run_id)}>✓ Mark Applied</button>
              <span className="note">Apply only after you've executed the trades — the target book becomes the next scan's baseline.</span>
            </div>

            {runs.length > 0 && (
              <div className="tbl-wrap" style={{marginTop:12}}>
                <table>
                  <thead><tr><th>Run</th><th>Created</th><th className="num">Turnover</th><th className="num">Tax</th><th className="num">Drag</th><th>State</th></tr></thead>
                  <tbody>
                    {runs.map(r=>(
                      <tr key={r.id}>
                        <td style={{fontFamily:'var(--mono)',color:'var(--t3)'}}>#{r.id}</td>
                        <td style={{fontFamily:'var(--mono)',color:'var(--t2)'}}>{new Date(r.created_at).toLocaleString('en-IN')}</td>
                        <td className="num">{r.plan && r.plan.turnover_pct!=null ? r.plan.turnover_pct+'%' : '—'}</td>
                        <td className="num">{r.plan && r.plan.total_tax!=null ? fmtRs(r.plan.total_tax) : '—'}</td>
                        <td className="num">{r.plan && r.plan.total_drag_pct!=null ? r.plan.total_drag_pct+'%' : '—'}</td>
                        <td>{r.applied ? <span className="badge badge-STRONG">APPLIED</span> : <span className="badge badge-WATCHLIST">PLANNED</span>}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}
          </div>
        )}
      </div>

      <div className="grid3">
        <div className="card"><div className="stat"><span className="stat-val">{fmtRs(totMv)}</span><span className="stat-key">Market Value</span></div></div>
        <div className="card"><div className="stat"><span className={`stat-val ${totPnl>=0?'acid':'rose'}`}>{fmtRs(totPnl)} <span style={{fontSize:12}}>({pct(totPct)})</span></span><span className="stat-key">Total P&L</span></div></div>
        <div className="card"><div className="stat"><span className="stat-val">{rows.length}</span><span className="stat-key">Holdings</span></div></div>
      </div>

      <div className="card">
        <div className="card-hdr"><span className="card-title">Add Holding</span></div>
        <form className="filter-row" onSubmit={add}>
          <label>Symbol
            <input list="universe-syms" placeholder="RELIANCE.NS" value={newSym} onChange={e=>setNewSym(e.target.value)}/>
            <datalist id="universe-syms">{universe.map(s=><option key={s} value={s}/>)}</datalist>
          </label>
          <label>Qty<input type="number" min="1" placeholder="10" value={qty} onChange={e=>setQty(e.target.value)}/></label>
          <label>Avg Price (₹)<input type="number" min="0.01" placeholder="2500" value={avg} onChange={e=>setAvg(e.target.value)}/></label>
          <button className="btn" type="submit">Add</button>
        </form>
        {err && <div className="note" style={{color:'var(--rose)',marginTop:8}}>{err}</div>}
      </div>

      <div className="card">
        {rows.length === 0 ? <Empty icon="💼" text="No holdings yet — add your first position above."/> : (
          <div className="tbl-wrap">
            <table>
              <thead><tr>
                <th>Symbol</th><th className="num">Qty</th><th className="num">Avg Cost</th><th className="num">LTP</th>
                <th className="num">Day %</th><th className="num">Cost</th><th className="num">Market Value</th>
                <th className="num">P&L</th><th className="num">P&L %</th><th></th>
              </tr></thead>
              <tbody>
                {rows.map(r=>(
                  <tr key={r.symbol}>
                    <td><span style={{color:'var(--t0)',fontWeight:600}}>{r.symbol.replace('.NS','')}</span></td>
                    <td className="num">{r.qty}</td>
                    <td className="num">{fmtRs(r.avg)}</td>
                    <td className="num">{fmtRs(r.ltp)}</td>
                    <td className={`num ${r.chg>=0?'up':'dn'}`}>{r.chg!=null ? pct(r.chg) : '—'}</td>
                    <td className="num">{fmtRs(r.cost)}</td>
                    <td className="num">{fmtRs(r.mv)}</td>
                    <td className={`num ${r.pnl>=0?'up':'dn'}`}>{fmtRs(r.pnl)}</td>
                    <td className={`num ${r.pnlPct>=0?'up':'dn'}`}>{pct(r.pnlPct)}</td>
                    <td><button className="btn-danger" onClick={()=>remove(r.symbol)}>✕</button></td>
                  </tr>
                ))}
              </tbody>
              <tfoot>
                <tr style={{background:'var(--bg3)'}}>
                  <td colSpan="5" style={{fontWeight:600,color:'var(--t0)'}}>Total</td>
                  <td className="num" style={{color:'var(--t0)'}}>{fmtRs(totCost)}</td>
                  <td className="num" style={{color:'var(--t0)'}}>{fmtRs(totMv)}</td>
                  <td className={`num ${totPnl>=0?'up':'dn'}`} style={{fontWeight:700}}>{fmtRs(totPnl)}</td>
                  <td className={`num ${totPnl>=0?'up':'dn'}`} style={{fontWeight:700}}>{pct(totPct)}</td>
                  <td/>
                </tr>
              </tfoot>
            </table>
          </div>
        )}
      </div>
    </div>
  );
}

/* ── BACKTEST ─────────────────────────────────────────────────────────── */
function Backtest(){
  const [params,setParams] = useState({years:'3', top_n:'10', initial:'1000000', stop:'0.20', cost:'0.25'});
  const [result,setResult] = useState(null);
  const [runs,setRuns] = useState([]);
  const [running,setRunning] = useState(false);
  const [err,setErr] = useState(null);

  const [alphaData,setAlphaData] = useState(null);
  const [bm,setBm] = useState(null);
  const [bmBusy,setBmBusy] = useState(false);
  const loadBm = ()=> j('/api/benchmarks').then(setBm).catch(()=>{});
  const refreshBm = async ()=>{
    setBmBusy(true);
    try { await j('/api/benchmarks/refresh', {method:'POST'}); } catch {}
    await loadBm();
    setBmBusy(false);
  };
  useEffect(()=>{ j('/api/backtests?limit=5').then(setRuns).catch(()=>{}); j('/api/alpha').then(setAlphaData).catch(()=>{}); loadBm(); },[]);

  const run = async ()=>{
    setRunning(true); setErr(null); setResult(null);
    try {
      const r = await j('/api/backtest', {method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({years:parseInt(params.years)||3, top_n:parseInt(params.top_n)||10,
          initial_capital:parseFloat(params.initial)||1000000, trailing_stop_pct:parseFloat(params.stop)||0.2, cost_pct:parseFloat(params.cost)||0.25})});
      setResult(r);
      j('/api/backtests?limit=5').then(setRuns).catch(()=>{});
    } catch(e){ setErr(e.detail || e.message); }
    finally { setRunning(false); }
  };
  const set = k => e => setParams({...params,[k]:e.target.value});
  const s = result ? result.summary : null;
  const [wf,setWf] = useState(null);
  const [wfRunning,setWfRunning] = useState(false);
  const [wfErr,setWfErr] = useState(null);
  const runWF = async ()=>{
    setWfRunning(true); setWfErr(null); setWf(null);
    try {
      const r = await j('/api/backtest/walk-forward', {method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({fold_months:12, folds:3, top_n:parseInt(params.top_n)||10,
          initial_capital:parseFloat(params.initial)||1000000, trailing_stop_pct:parseFloat(params.stop)||0.2})});
      setWf(r);
    } catch(e){ setWfErr(e.detail || e.message); }
    finally { setWfRunning(false); }
  };

  return (
    <div className="wrap anim">
      <div><div className="screen-title">Backtest</div><div className="screen-sub">Momentum + trend strategy · monthly rebalance · trailing stop · walk-forward</div></div>

      <div className="card">
        <div className="filter-row">
          <label>Years<input type="number" min="1" max="10" value={params.years} onChange={set('years')}/></label>
          <label>Top N per month<input type="number" min="1" max="30" value={params.top_n} onChange={set('top_n')}/></label>
          <label>Initial Capital (₹)<input type="number" value={params.initial} onChange={set('initial')}/></label>
          <label>Trailing Stop %<input type="number" step="0.05" value={params.stop} onChange={set('stop')}/></label>
          <label>Cost %/side<input type="number" step="0.05" value={params.cost} onChange={set('cost')}/></label>
          <button className="btn" disabled={running} onClick={run}>{running ? 'Running…' : '▶ Run Backtest'}</button>
          <button className="btn-ghost" disabled={running || wfRunning} onClick={runWF}>{wfRunning ? 'Running…' : '⇄ Walk-Forward (3×12m)'}</button>
        </div>
        {err && <div className="note" style={{color:'var(--rose)',marginTop:10}}>{err}</div>}
        {wfErr && <div className="note" style={{color:'var(--rose)',marginTop:10}}>{wfErr}</div>}
        {result && result.warnings && result.warnings.length > 0 && <div className="note" style={{color:'var(--gold)',marginTop:10}}>{result.warnings.join(' · ')}</div>}
      </div>

      {bm && (
        <div className="card">
          <div className="card-hdr"><span className="card-title">Index Benchmarks</span><span className="note">stored NIFTY 50 · Midcap 150 · Smallcap 250 — refreshed with every scan</span>
            <button className="btn-ghost" style={{marginLeft:'auto'}} disabled={bmBusy} onClick={refreshBm}>{bmBusy ? 'Fetching…' : '⟳ Refresh'}</button>
          </div>
          <div style={{display:'flex',gap:20,flexWrap:'wrap',alignItems:'center'}}>
            {Object.values(bm.coverage||{}).map(c=>(
              <div key={c.symbol} className="stat">
                <span className="stat-val" style={{fontSize:14}}>{c.rows>0 ? c.rows+' rows' : '—'}</span>
                <span className="stat-key">{c.symbol} · {c.first_date ? c.first_date+' → '+c.last_date : 'not stored yet'}</span>
              </div>
            ))}
            {!bm.coverage || Object.keys(bm.coverage).length===0 ? <div className="note">No index data stored — run a scan (or ⟳ Refresh) to seed Nifty 50 / Midcap 150 / Smallcap 250 history.</div> : null}
          </div>
        </div>
      )}

      {result && s && !s.error && (
        <>
          <div className="grid3">
            <div className="card"><div className="stat"><span className={`stat-val ${s.cagr_pct>=0?'acid':'rose'}`}>{pct(s.cagr_pct)}</span><span className="stat-key">CAGR</span></div></div>
            <div className="card"><div className="stat"><span className="stat-val rose">{Number(s.max_drawdown_pct).toFixed(1)}%</span><span className="stat-key">Max Drawdown</span></div></div>
            <div className="card"><div className="stat"><span className="stat-val gold">{Number(s.sharpe).toFixed(2)}</span><span className="stat-key">Sharpe</span></div></div>
            <div className="card"><div className="stat"><span className={`stat-val ${s.sortino!=null && s.sortino>=0?'acid':'rose'}`}>{s.sortino!=null ? Number(s.sortino).toFixed(2) : '—'}</span><span className="stat-key">Sortino</span></div></div>
            <div className="card"><div className="stat"><span className="stat-val">{s.turnover_annual!=null ? s.turnover_annual+'x' : '—'}</span><span className="stat-key">Turnover / Yr</span></div></div>
            <div className="card"><div className="stat"><span className={`stat-val ${s.cost_drag_pct!=null && s.cost_drag_pct<8?'acid':'gold'}`}>{s.cost_drag_pct!=null ? s.cost_drag_pct+'%' : '—'}</span><span className="stat-key">Cost Drag</span></div></div>
            <div className="card"><div className="stat"><span className="stat-val">{s.win_rate_pct != null ? s.win_rate_pct+'%' : '—'}</span><span className="stat-key">Win Rate</span></div></div>
            <div className="card"><div className="stat"><span className={`stat-val ${s.net_return_pct>=0?'acid':'rose'}`}>{pct(s.net_return_pct)}</span><span className="stat-key">Net Return</span></div></div>
            <div className="card"><div className="stat"><span className="stat-val">{fmtRs(s.final_value)}</span><span className="stat-key">Final Value</span></div></div>
            <div className="card"><div className="stat"><span className={`stat-val ${s.alpha_pct!=null && s.alpha_pct>=0?'acid':'rose'}`}>{s.alpha_pct!=null ? pct(s.alpha_pct) : '—'}</span><span className="stat-key">Alpha vs NIFTY 50</span></div></div>
            {s.benchmark_cagr_pct!=null && <div className="card"><div className="stat"><span className="stat-val gold">{pct(s.benchmark_cagr_pct)}</span><span className="stat-key">NIFTY CAGR</span></div></div>}
            {s.universe_alpha_pct!=null && <div className="card"><div className="stat"><span className={`stat-val ${s.universe_alpha_pct>=0?'acid':'rose'}`}>{pct(s.universe_alpha_pct)}</span><span className="stat-key">Alpha vs Universe EW</span></div></div>}
            {s.universe_cagr_pct!=null && <div className="card"><div className="stat"><span className="stat-val gold">{pct(s.universe_cagr_pct)}</span><span className="stat-key">Universe EW CAGR</span></div></div>}
          </div>

          <div className="card">
            <div className="card-hdr"><span className="card-title">Equity Curve</span><span className="note">solid = strategy · dashed gold = NIFTY 50 · dashed sky = Universe EW</span></div>
            {result.equity_curve.length > 2 ? (
              <div style={{height:280}}>
                <ResponsiveContainer width="100%" height="100%">
                  <LineChart data={(()=>{ const bm=(result.benchmark_curve||[]).reduce((m,p)=>{m[p.date]=p.value;return m;},{}); const uv=(result.universe_curve||[]).reduce((m,p)=>{m[p.date]=p.value;return m;},{}); return result.equity_curve.map(p=>({...p, bench:bm[p.date], uni:uv[p.date]})); })()} margin={{top:8,right:8,bottom:0,left:8}}>
                    <XAxis dataKey="date" tick={{fill:'#3a445e',fontSize:9,fontFamily:'Geist Mono'}} axisLine={false} tickLine={false} minTickGap={40}/>
                    <YAxis domain={['auto','auto']} tick={{fill:'#3a445e',fontSize:9,fontFamily:'Geist Mono'}} axisLine={false} tickLine={false} width={70} tickFormatter={v=>v>=100000?'₹'+(v/100000).toFixed(0)+'L':'₹'+v}/>
                    <Tooltip contentStyle={{backgroundColor:'#0c1120',borderColor:'#161f30',borderRadius:8,fontSize:10,fontFamily:'Geist Mono'}}
                      formatter={(v,name)=>({Equity:['₹'+Number(v).toLocaleString('en-IN',{maximumFractionDigits:0}),'Equity'],bench:['₹'+Number(v).toLocaleString('en-IN',{maximumFractionDigits:0}),'NIFTY 50'],uni:['₹'+Number(v).toLocaleString('en-IN',{maximumFractionDigits:0}),'Universe EW']}[name]||[v,name])}/>
                    <Line type="monotone" dataKey="equity" stroke="#00ffa3" strokeWidth={1.8} dot={false}/>
                    <Line type="monotone" dataKey="bench" stroke="#ffb700" strokeWidth={1.2} strokeDasharray="4 3" dot={false}/>
                    <Line type="monotone" dataKey="uni" stroke="#3d9eff" strokeWidth={1.2} strokeDasharray="2 3" dot={false}/>
                    <ReferenceDot x={result.equity_curve[0].date} y={s.initial_capital} r={2} fill="#ffb700"/>
                  </LineChart>
                </ResponsiveContainer>
              </div>
            ) : <Empty icon="📈" text="Equity curve needs more history — run a scan with ≥2y of prices."/>}
          </div>

          {result.benchmarks && result.benchmarks.length > 0 && (
            <div className="card">
              <div className="card-hdr"><span className="card-title">Alpha vs Indices</span><span className="note">buy-and-hold over the same window — the model must beat the market, not just its own universe</span></div>
              <div className="tbl-wrap">
                <table>
                  <thead><tr><th>Benchmark</th><th className="num">Return</th><th className="num">CAGR</th><th className="num">Max DD</th><th className="num">Sharpe</th><th className="num">Sortino</th><th className="num">Alpha</th></tr></thead>
                  <tbody>
                    {result.benchmarks.map(b=>(
                      <tr key={b.name}>
                        <td style={{color:'var(--t0)',fontWeight:600}}>{b.name}</td>
                        <td className={`num ${b.return_pct>=0?'up':'dn'}`}>{pct(b.return_pct)}</td>
                        <td className={`num ${b.cagr_pct>=0?'up':'dn'}`}>{pct(b.cagr_pct)}</td>
                        <td className="num rose">{Number(b.max_drawdown_pct).toFixed(1)}%</td>
                        <td className="num gold">{Number(b.sharpe).toFixed(2)}</td>
                        <td className="num gold">{Number(b.sortino).toFixed(2)}</td>
                        <td className={`num ${b.alpha_pct>=0?'acid':'rose'}`} style={{fontWeight:700}}>{pct(b.alpha_pct)}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          )}

          <div className="card">
            <div className="card-hdr"><span className="card-title">Trades ({result.trades.length})</span></div>
            {result.trades.length === 0 ? <Empty icon="🔄" text="No trades executed in this window."/> : (
              <div className="tbl-wrap">
                <table>
                  <thead><tr><th>Symbol</th><th>Entry Date</th><th>Exit Date</th><th className="num">Entry</th><th className="num">Exit</th><th className="num">Return</th><th>Exit</th></tr></thead>
                  <tbody>
                    {result.trades.slice(-40).reverse().map((t,i)=>(
                      <tr key={i}>
                        <td style={{color:'var(--t0)',fontWeight:600}}>{t.symbol.replace('.NS','')}</td>
                        <td style={{fontFamily:'var(--mono)',color:'var(--t2)'}}>{t.entry_date}</td>
                        <td style={{fontFamily:'var(--mono)',color:'var(--t2)'}}>{t.exit_date}</td>
                        <td className="num">{fmtRs(t.entry_price)}</td>
                        <td className="num">{fmtRs(t.exit_price)}</td>
                        <td className={`num ${t.return_pct>=0?'up':'dn'}`}>{pct(t.return_pct)}</td>
                        <td><span className={`badge badge-${t.reason==='trailing_stop'?'STRONG':t.reason==='sma50_break'?'WATCHLIST':'ELITE'}`}>{t.reason}</span></td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}
          </div>
        </>
      )}

      {alphaData && (
        <div className="card">
          <div className="card-hdr"><span className="card-title">Model Self-Measurement</span><span className="note">forward returns after signals · factor IC (which factor predicts?)</span></div>
          {alphaData.decay && alphaData.decay.length > 0 ? (
            <div className="grid3">
              {alphaData.decay.map(d=>(
                <div key={d.horizon_days} className="card">
                  <div className="stat"><span className={`stat-val ${d.avg_return_pct>=0?'acid':'rose'}`}>{pct(d.avg_return_pct)}</span><span className="stat-key">{d.horizon_days}-day forward return · hit {fmt(d.hit_rate_pct,0)}% · n={d.n}</span></div>
                </div>
              ))}
            </div>
          ) : <div className="note">No measured signals yet — alpha decay fills in after scans and elapsed price history accumulate.</div>}
          {alphaData.ic && Object.keys(alphaData.ic.factors||{}).length > 0 && (
            <div className="tbl-wrap" style={{marginTop:12}}>
              <table>
                <thead><tr><th>Factor</th><th className="num">Avg IC</th><th className="num">Last IC</th><th className="num">Samples</th><th>Best Regime</th></tr></thead>
                <tbody>
                  {Object.entries(alphaData.ic.factors).sort((a,b)=>b[1].avg_ic-a[1].avg_ic).map(([f,info])=>{
                    const regimes = alphaData.ic.regimes||{};
                    let best = '—', bestIc = -2;
                    Object.entries(regimes).forEach(([rg,fm])=>{ if(fm[f]!=null && fm[f]>bestIc){ bestIc=fm[f]; best=rg; } });
                    return (
                      <tr key={f}>
                        <td style={{color:'var(--t0)',fontWeight:600}}>{f}</td>
                        <td className={`num ${info.avg_ic>0?'up':'dn'}`}>{Number(info.avg_ic).toFixed(3)}</td>
                        <td className={`num ${info.last_ic>0?'up':'dn'}`}>{Number(info.last_ic).toFixed(3)}</td>
                        <td className="num">{info.n}</td>
                        <td>{best!=='—' ? <span className={`badge badge-${best==='BULL'?'MULTIBAGGER':best==='BEAR'?'WATCHLIST':best==='HIGH_VOLATILITY'?'EMERGING':'STRONG'}`}>{best}</span> : '—'}</td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          )}
        </div>
      )}

      {wf && wf.summary && !wf.summary.error && (
        <div className="card">
          <div className="card-hdr"><span className="card-title">Walk-Forward · {wf.summary.folds_evaluated} × {wf.summary.fold_months}m folds</span><span className="note">same parameter-free strategy across consecutive windows — flags overfitting / regime dependence</span></div>
          <div className="grid3">
            <div className="card"><div className="stat"><span className={`stat-val ${wf.summary.avg_return_pct>=0?'acid':'rose'}`}>{pct(wf.summary.avg_return_pct)}</span><span className="stat-key">Avg Return / Fold</span></div></div>
            <div className="card"><div className="stat"><span className={`stat-val ${wf.summary.hit_rate_pct>=60?'acid':wf.summary.hit_rate_pct>=40?'gold':'rose'}`}>{fmt(wf.summary.hit_rate_pct,0)}%</span><span className="stat-key">Fold Hit Rate</span></div></div>
            <div className="card"><div className="stat"><span className="stat-val rose">{fmt(wf.summary.worst_max_drawdown_pct,1)}%</span><span className="stat-key">Worst Fold Drawdown</span></div></div>
          </div>
          <div className="tbl-wrap" style={{marginTop:12}}>
            <table>
              <thead><tr><th className="num">Fold</th><th>Window</th><th className="num">Return</th><th className="num">CAGR</th><th className="num">Max DD</th><th className="num">Sharpe</th><th className="num">Trades</th></tr></thead>
              <tbody>
                {wf.folds.map(f=>(
                  <tr key={f.fold}>
                    <td style={{color:'var(--t3)',fontFamily:'var(--mono)'}}>#{f.fold}</td>
                    <td style={{fontFamily:'var(--mono)',color:'var(--t2)'}}>{f.window}</td>
                    <td className={`num ${f.net_return_pct>=0?'up':'dn'}`}>{pct(f.net_return_pct)}</td>
                    <td className={`num ${f.cagr_pct>=0?'up':'dn'}`}>{pct(f.cagr_pct)}</td>
                    <td className="num rose">{fmt(f.max_drawdown_pct,1)}%</td>
                    <td className="num gold">{fmt(f.sharpe,2)}</td>
                    <td className="num">{f.trades}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      )}

      {runs.length > 0 && (
        <div className="card">
          <div className="card-hdr"><span className="card-title">Recent Runs</span></div>
          <div className="tbl-wrap">
            <table>
              <thead><tr><th>Run</th><th className="num">CAGR</th><th className="num">Max DD</th><th className="num">Sharpe</th><th className="num">Trades</th><th>Params</th></tr></thead>
              <tbody>
                {runs.map(r=>(
                  <tr key={r.id} style={{cursor:'pointer'}} onClick={()=>setResult(r)}>
                    <td style={{fontFamily:'var(--mono)',color:'var(--t3)'}}>#{r.id}</td>
                    <td className={`num ${r.summary.cagr_pct>=0?'up':'dn'}`}>{r.summary.cagr_pct!=null ? pct(r.summary.cagr_pct) : '—'}</td>
                    <td className="num rose">{r.summary.max_drawdown_pct!=null ? r.summary.max_drawdown_pct+'%' : '—'}</td>
                    <td className="num gold">{r.summary.sharpe!=null ? r.summary.sharpe : '—'}</td>
                    <td className="num">{r.summary.trades!=null ? r.summary.trades : '—'}</td>
                    <td style={{fontFamily:'var(--mono)',color:'var(--t3)',fontSize:9}}>{r.params ? `${r.params.years}y top${r.params.top_n} stop${r.params.trailing_stop_pct}` : '—'}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      )}
    </div>
  );
}

/* ── IDEAS (watchlist intelligence feed) ────────────────────────────────── */
const EVENT_STYLE = {
  RS_LEADER:   {cls:'STRONG',     label:'RS Leader'},
  SCORE_SURGE: {cls:'EMERGING',   label:'Score Surge'},
  MB_ELITE:    {cls:'MULTIBAGGER',label:'MB Elite'},
  SECTOR_TOP3: {cls:'WATCHLIST',  label:'Sector Top-3'},
};
function Ideas(){
  const [events,setEvents] = useState([]);
  const [filter,setFilter] = useState('ALL');
  const [q,setQ] = useState('');
  const [explain,setExplain] = useState(null);
  const load = useCallback(()=>{ j('/api/events?limit=250').then(d=>setEvents(d||[])).catch(()=>{}); },[]);
  useEffect(load,[load]);
  const counts = {};
  events.forEach(e=>{ counts[e.event] = (counts[e.event]||0)+1; });
  const types = ['ALL', ...Object.keys(counts).sort()];
  const shown = events.filter(e=>
    (filter==='ALL' || e.event===filter) &&
    (!q || (e.symbol||'').includes(q.trim().toUpperCase()))
  );
  const byDate = {};
  shown.forEach(e=>{ (byDate[e.scan_date] = byDate[e.scan_date] || []).push(e); });
  return (
    <div className="wrap anim">
      <div style={{display:'flex',alignItems:'baseline',gap:12}}>
        <div><div className="screen-title">Ideas</div><div className="screen-sub">watchlist intelligence — the daily idea generator · click any event for the full "why"</div></div>
        <div className="note" style={{marginLeft:'auto'}}>{events.length} events · {Object.keys(counts).map(t=>t+': '+counts[t]).join(' · ')}</div>
      </div>

      <div className="card">
        <div className="filter-row">
          <label>Type
            <select value={filter} onChange={e=>setFilter(e.target.value)}>
              {types.map(t=> <option key={t} value={t}>{t==='ALL' ? 'All events' : (EVENT_STYLE[t]?EVENT_STYLE[t].label:t)} ({t==='ALL'?events.length:(counts[t]||0)})</option>)}
            </select>
          </label>
          <label>Symbol
            <input placeholder="Search…" value={q} onChange={e=>setQ(e.target.value)}/>
          </label>
          <button className="btn-ghost" onClick={load}>⟳ Reload</button>
        </div>
        {shown.length === 0 ? <div className="note">No events yet — consecutive scans surface RS leaders, score surges, MB elites and top-ranked sectors.</div> : (
          Object.entries(byDate).sort((a,b)=>b[0].localeCompare(a[0])).map(([date,rows])=>(
            <div key={date} style={{marginTop:10}}>
              <div style={{fontFamily:'var(--mono)',fontSize:9,color:'var(--t3)',marginBottom:6}}>{date} · {rows.length} events</div>
              <div style={{display:'flex',flexDirection:'column',gap:6}}>
                {rows.map((e,i)=>(
                  <div key={i} style={{display:'flex',alignItems:'center',gap:10,padding:'8px 10px',background:'var(--bg2)',border:'1px solid var(--wire)',borderRadius:8,cursor:'pointer'}} onClick={()=>setExplain(e.symbol)}>
                    <span className={`badge badge-${(EVENT_STYLE[e.event]||{cls:'ELITE'}).cls}`}>{(EVENT_STYLE[e.event]||{label:e.event}).label}</span>
                    <span style={{color:'var(--t0)',fontWeight:700}}>{e.symbol.replace('.NS','')}</span>
                    <span style={{color:'var(--t2)',flex:1}}>{e.detail}</span>
                    <span style={{fontFamily:'var(--mono)',fontSize:9,color:'var(--sky)'}}>explain ▸</span>
                  </div>
                ))}
              </div>
            </div>
          ))
        )}
      </div>
      {explain && <Explain symbol={explain} onClose={()=>setExplain(null)}/>}
    </div>
  );
}

/* ── APP ──────────────────────────────────────────────────────────────── */
function App(){
  const [tab,setTab] = useState('Dashboard');
  const [regime,setRegime] = useState(null);
  useEffect(()=>{ j('/api/regime').then(setRegime).catch(()=>{}); },[]);
  return (
    <>
      <Nav tab={tab} setTab={setTab} regime={regime}/>
      <div className="body">
        {tab==='Dashboard' && <Dashboard/>}
        {tab==='Screener' && <Screener/>}
        {tab==='Elite Picks' && <ElitePicks/>}
        {tab==='Discovery' && <Discovery/>}
        {tab==='Research' && <Research/>}
        {tab==='Ideas' && <Ideas/>}
        {tab==='Portfolio' && <Portfolio/>}
        {tab==='Backtest' && <Backtest/>}
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>

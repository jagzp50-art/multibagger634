<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sovereign Lite v15</title>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/recharts/umd/Recharts.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Geist+Mono:wght@300;400;500;600&family=Geist:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
:root{
  --bg0:#04060d;--bg1:#080c17;--bg2:#0c1120;--bg3:#111928;--bg4:#161f30;
  --wire:rgba(255,255,255,.055);--wire2:rgba(255,255,255,.10);--wire3:rgba(255,255,255,.18);
  --t0:#ffffff;--t1:#c9d4f0;--t2:#6d7fa8;--t3:#3a445e;
  --acid:#00ffa3;--acid-d:rgba(0,255,163,.10);--acid-g:0 0 20px rgba(0,255,163,.22);
  --rose:#ff3060;--rose-d:rgba(255,48,96,.10);
  --gold:#ffb700;--gold-d:rgba(255,183,0,.10);
  --sky:#3d9eff;--sky-d:rgba(61,158,255,.10);
  --mono:'Geist Mono',monospace;--sans:'Geist',sans-serif;--display:'Syne',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg0);color:var(--t1);font-family:var(--sans);font-size:13px}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,transparent 0,transparent 1px,rgba(255,255,255,.010) 1px,rgba(255,255,255,.010) 2px);background-size:100% 2px;opacity:.6}
body::after{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(ellipse 60% 30% at 5% 0%,rgba(0,255,163,.03) 0%,transparent 70%),
             radial-gradient(ellipse 40% 40% at 95% 5%,rgba(61,158,255,.04) 0%,transparent 70%)}
#root{position:relative;z-index:1;display:flex;flex-direction:column;height:100vh}

.nav{display:flex;align-items:center;padding:0 24px;height:52px;background:rgba(4,6,13,.94);backdrop-filter:blur(24px);border-bottom:1px solid var(--wire);flex-shrink:0}
.nav-brand{display:flex;align-items:center;gap:10px;padding-right:16px;margin-right:8px;border-right:1px solid var(--wire);flex-shrink:0}
.nav-sigma{width:28px;height:28px;border-radius:7px;background:conic-gradient(from 135deg,var(--acid),var(--sky),var(--acid));display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-size:13px;color:var(--bg0)}
.nav-wordmark{font-family:var(--display);font-size:14px;font-weight:800;letter-spacing:2px;color:var(--t0)}
.nav-sub{font-family:var(--mono);font-size:8px;color:var(--t3);letter-spacing:1px;text-transform:uppercase}
.nav-tabs{display:flex;gap:1px;flex:1;padding:0 12px;overflow-x:auto}
.nav-tab{padding:0 14px;height:52px;display:flex;align-items:center;font-family:var(--mono);font-size:10px;font-weight:500;color:var(--t3);border-bottom:2px solid transparent;transition:all .15s;white-space:nowrap;cursor:pointer;background:none;border-top:none;border-left:none;border-right:none}
.nav-tab:hover{color:var(--t1);border-bottom-color:var(--wire2)}
.nav-tab.active{color:var(--acid);border-bottom-color:var(--acid)}
.nav-right{display:flex;align-items:center;gap:10px;padding-left:14px;border-left:1px solid var(--wire);flex-shrink:0;font-family:var(--mono);font-size:9px;color:var(--t2)}
.regime-chip{font-family:var(--mono);font-size:9px;font-weight:600;padding:3px 9px;border-radius:4px}
.regime-BULL{background:var(--acid-d);color:var(--acid)}
.regime-BEAR{background:var(--rose-d);color:var(--rose)}
.regime-SIDEWAYS{background:var(--gold-d);color:var(--gold)}
.regime-HIGH_VOLATILITY{background:var(--rose-d);color:var(--rose)}
.vix-pill{display:flex;align-items:center;gap:6px;padding:4px 10px;border-radius:20px;background:var(--bg2);border:1px solid var(--wire);font-family:var(--mono);font-size:10px}
.vix-dot{width:5px;height:5px;border-radius:50%}
.vix-dot.safe{background:var(--acid);box-shadow:0 0 6px var(--acid)}
.vix-dot.warn{background:var(--gold);box-shadow:0 0 6px var(--gold)}
.vix-dot.risk{background:var(--rose);box-shadow:0 0 6px var(--rose)}

.body{flex:1;overflow-y:auto;padding:20px 24px}
.wrap{max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.screen-title{font-family:var(--display);font-size:22px;font-weight:800;color:var(--t0);letter-spacing:.3px}
.screen-sub{font-family:var(--mono);font-size:9px;color:var(--t3);margin-top:2px;text-transform:uppercase;letter-spacing:1px}

.card{background:var(--bg2);border:1px solid var(--wire);border-radius:12px;padding:16px;overflow:hidden}
.card-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.card-title{font-family:var(--mono);font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:1.2px;color:var(--t2);display:flex;align-items:center;gap:8px}
.card-title::before{content:'';width:10px;height:1px;background:var(--acid)}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media(max-width:900px){.grid2,.grid3{grid-template-columns:1fr}}

table{width:100%;border-collapse:collapse;font-size:11px}
th{font-family:var(--mono);font-size:8px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.8px;text-align:left;padding:8px 10px;border-bottom:1px solid var(--wire);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid rgba(255,255,255,.03);color:var(--t1);white-space:nowrap}
tr:hover td{background:rgba(255,255,255,.015)}
.tbl-wrap{overflow-x:auto}
.num{font-family:var(--mono);text-align:right}
.up{color:var(--acid)}.dn{color:var(--rose)}.warn{color:var(--gold)}

.badge{font-family:var(--mono);font-size:8px;font-weight:700;padding:2px 7px;border-radius:3px;text-transform:uppercase;letter-spacing:.3px}
.badge-MULTIBAGGER{background:var(--acid-d);color:var(--acid);border:1px solid rgba(0,255,163,.25)}
.badge-STRONG{background:var(--gold-d);color:var(--gold);border:1px solid rgba(255,183,0,.25)}
.badge-EMERGING{background:var(--sky-d);color:var(--sky);border:1px solid rgba(61,158,255,.25)}
.badge-WATCHLIST{background:var(--bg3);color:var(--t3);border:1px solid var(--wire)}
.rule{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:8px;font-weight:600;padding:2px 6px;border-radius:3px;margin:1px}
.rule.pass{background:var(--acid-d);color:var(--acid)}
.rule.fail{background:var(--bg3);color:var(--t3)}
.rule.fail::before{content:'✕';color:var(--rose)}
.rule.pass::before{content:'✓'}

.sc-bar{display:inline-block;width:46px;height:3px;background:var(--bg0);border-radius:2px;overflow:hidden;vertical-align:middle;margin-right:6px}
.sc-fill{height:100%;border-radius:2px}
.btn{padding:8px 18px;border-radius:20px;background:linear-gradient(135deg,var(--acid) 0%,#00cc85 100%);color:var(--bg0);font-family:var(--mono);font-size:10px;font-weight:700;border:none;cursor:pointer;transition:all .2s}
.btn:hover{box-shadow:var(--acid-g);transform:translateY(-1px)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn-ghost{padding:7px 14px;border-radius:8px;border:1px solid var(--wire2);background:transparent;color:var(--t2);font-family:var(--mono);font-size:10px;font-weight:600;cursor:pointer;transition:all .15s}
.btn-ghost:hover{background:var(--bg3);color:var(--t1);border-color:var(--wire3)}
.btn-danger{padding:4px 10px;border-radius:6px;border:1px solid rgba(255,48,96,.3);background:transparent;color:var(--rose);font-family:var(--mono);font-size:9px;cursor:pointer}
.btn-danger:hover{background:var(--rose-d)}

input,select{background:var(--bg3);border:1px solid var(--wire2);color:var(--t0);border-radius:8px;font-family:var(--mono);font-size:10px;padding:7px 10px;outline:none;transition:border .15s}
input:focus,select:focus{border-color:var(--acid);box-shadow:0 0 0 3px var(--acid-d)}
input::placeholder{color:var(--t3)}
label{font-family:var(--mono);font-size:8px;color:var(--t3);text-transform:uppercase;letter-spacing:.8px;display:flex;flex-direction:column;gap:5px}
.filter-row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.filter-row>label{min-width:110px;flex:1}

.stat{display:flex;flex-direction:column;gap:4px}
.stat-val{font-family:var(--mono);font-size:22px;font-weight:600;color:var(--t0)}
.stat-key{font-family:var(--mono);font-size:8px;color:var(--t3);text-transform:uppercase;letter-spacing:1px}
.stat-val.acid{color:var(--acid)}.stat-val.rose{color:var(--rose)}.stat-val.gold{color:var(--gold)}

.alloc{display:flex;height:34px;border-radius:8px;overflow:hidden;border:1px solid var(--wire);font-family:var(--mono);font-size:10px;font-weight:600}
.alloc>div{display:flex;align-items:center;justify-content:center}
.alloc .eq{background:linear-gradient(135deg,rgba(0,255,163,.25),rgba(0,204,133,.12));color:var(--acid)}
.alloc .cs{background:rgba(255,255,255,.05);color:var(--t2)}

.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:40px 20px;text-align:center}
.empty-icon{font-size:30px;opacity:.35}
.empty-txt{font-family:var(--mono);font-size:11px;color:var(--t3)}
.loading-dot{display:inline-block;width:4px;height:4px;border-radius:50%;background:var(--acid);animation:pulse 1.4s ease-in-out infinite}
.loading-dot:nth-child(2){animation-delay:.2s}.loading-dot:nth-child(3){animation-delay:.4s}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(1.3)}}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.anim{animation:rise .3s ease both}
.note{font-family:var(--mono);font-size:9px;color:var(--t3);line-height:1.6}
.status-line{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:10px;color:var(--t2)}
.pulse-dot{width:6px;height:6px;border-radius:50%;background:var(--acid);box-shadow:0 0 8px var(--acid);animation:pulse 1.2s infinite}
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const {useState, useEffect, useCallback, useMemo, useRef} = React;
const {LineChart,Line,XAxis,YAxis,Tooltip,ResponsiveContainer,ReferenceDot,Legend} = Recharts;

const API = '';
const SCORE_COLOR = s => s >= 75 ? '#00ffa3' : s >= 55 ? '#ffb700' : '#ff3060';
const fmt = (v, d=2) => v == null || isNaN(v) ? '—' : Number(v).toLocaleString('en-IN',{maximumFractionDigits:d});
const pct = v => v == null || isNaN(v) ? '—' : (v > 0 ? '+' : '') + Number(v).toFixed(1) + '%';
const fmtCr = v => v == null || isNaN(v) ? '—' : '₹' + Number(v).toLocaleString('en-IN',{maximumFractionDigits:0}) + ' Cr';
const fmtRs = v => v == null || isNaN(v) ? '—' : '₹' + Number(v).toLocaleString('en-IN',{maximumFractionDigits:2});

async function j(url, opts) {
  const r = await fetch(API + url, opts);
  if (!r.ok) throw new Error((await r.json().catch(()=>({}))).detail || `${r.status}`);
  return r.json();
}

function ScoreCell({score}){
  const c = SCORE_COLOR(score);
  return <span><span className="sc-bar"><span className="sc-fill" style={{width:(score||0)+'%',background:c,display:'block'}}/></span><span style={{fontFamily:'var(--mono)',fontWeight:600,color:c}}>{fmt(score,0)}</span></span>;
}
function Delta({v, suffix=''}){
  if (v == null || isNaN(v)) return <span style={{color:'var(--t3)',fontFamily:'var(--mono)'}}>—</span>;
  if (v === 0) return <span style={{color:'var(--t3)',fontFamily:'var(--mono)'}}>•</span>;
  const c = v > 0 ? 'var(--acid)' : 'var(--rose)';
  return <span className="num" style={{color:c,fontFamily:'var(--mono)',fontWeight:600}}>{v > 0 ? '▲' : '▼'} {v > 0 ? '+' : ''}{Number(v).toFixed(1)}{suffix}</span>;
}
function Bucket({b}){ return b ? <span className={`badge badge-${b}`}>{b}</span> : null; }
function ConfCell({v}){
  if (v == null || isNaN(v)) return <span style={{color:'var(--t3)',fontFamily:'var(--mono)'}}>—</span>;
  const c = v >= 80 ? 'var(--acid)' : v >= 60 ? 'var(--gold)' : 'var(--rose)';
  return <span style={{fontFamily:'var(--mono)',fontWeight:600,color:c}}>{fmt(v,0)}%</span>;
}
function Loader(){ return <div style={{display:'flex',gap:4,padding:'20px 0',justifyContent:'center'}}><span className="loading-dot"/><span className="loading-dot"/><span className="loading-dot"/></div>; }
function Empty({icon,text,children}){ return <div className="empty"><div className="empty-icon">{icon}</div><div className="empty-txt">{text}</div>{children}</div>; }

/* ── NAV ─────────────────────────────────────────────────────────────── */
function Nav({tab,setTab,regime}){
  const tabs = ['Dashboard','Screener','Elite Picks','Discovery','Research','Ideas','Portfolio','Backtest'];
  const vix = regime && regime.vix;
  const vixClass = !vix ? 'warn' : vix >= 25 ? 'risk' : vix >= 20 ? 'warn' : 'safe';
  return (
    <nav className="nav">
      <div className="nav-brand">
        <div className="nav-sigma">Σ</div>
        <div><div className="nav-wordmark">SOVEREIGN</div><div className="nav-sub">Lite v15 · Single User</div></div>
      </div>
      <div className="nav-tabs">
        {tabs.map(t => <button key={t} className={`nav-tab${tab===t?' active':''}`} onClick={()=>setTab(t)}>{t}</button>)}
      </div>
      <div className="nav-right">
        {regime && regime.regime && <span className={`regime-chip regime-${regime.regime}`}>{regime.regime}</span>}
        {vix != null && <div className="vix-pill"><div className={`vix-dot ${vixClass}`}/><span style={{color:'var(--t3)',fontSize:'8px'}}>VIX</span><span style={{color:'var(--gold)',fontWeight:600}}>{Number(vix).toFixed(1)}</span></div>}
      </div>
    </nav>
  );
}

/* ── DASHBOARD ───────────────────────────────────────────────────────── */
function Dashboard(){
  const [data,setData] = useState(null);
  const [sectors,setSectors] = useState(null);
  const [quality,setQuality] = useState(null);
  const [err,setErr] = useState(null);
  const [scanning,setScanning] = useState(false);
  const [scanResult,setScanResult] = useState(null);
  const [delivery,setDelivery] = useState(null);
  const [delBusy,setDelBusy] = useState(false);
  const refreshDel = async ()=>{
    setDelBusy(true);
    try { await j('/api/delivery/refresh', {method:'POST'}); } catch {}
    j('/api/delivery').then(setDelivery).catch(()=>{});
    setDelBusy(false);
  };
  const load = useCallback(()=>{ j('/api/dashboard').then(setData).catch(e=>setErr(e.message)); j('/api/sectors').then(setSectors).catch(()=>{}); j('/api/data-quality').then(setQuality).catch(()=>{}); j('/api/delivery').then(setDelivery).catch(()=>{}); },[load]);
  useEffect(load,[load]);

  const runScan = async (force, tier='core')=>{
    setScanning(true); setScanResult(null);
    try { const r = await j(`/api/scan?tier=${tier}` + (force ? '&force=true' : ''), {method:'POST'}); setScanResult(r); load(); }
    catch(e){ setScanResult({error:e.message}); }
    finally { setScanning(false); }
  };

  if (err && !data) return <Empty icon="⚠️" text={err}><button className="btn-ghost" onClick={load}>Retry</button></Empty>;
  if (!data) return <Loader/>;
  const {regime, allocation, top_picks, universe_size, universe_tiers, scored, last_scan_at, portfolio_risk} = data;

  return (
    <div className="wrap anim">
      <div><div className="screen-title">Market Dashboard</div><div className="screen-sub">Regime · Allocation · Top Picks</div></div>

      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(150px,1fr))',gap:10,marginBottom:14}}>
        <div className="card" style={{padding:'12px 14px'}}>
          <div style={{fontSize:9,fontWeight:700,letterSpacing:'0.12em',color:'var(--t3)'}}>MARKET REGIME</div>
          <div style={{display:'flex',alignItems:'center',gap:8,marginTop:6}}>
            <span className={`regime-chip regime-${regime.regime}`}>{regime.regime}</span>
            <span style={{fontFamily:'var(--mono)',fontSize:10,color:'var(--t2)'}}>{regime.vix != null ? 'VIX '+Number(regime.vix).toFixed(1) : ''}</span>
          </div>
          <div className="note" style={{marginTop:6}}>{regime.reason}</div>
        </div>
        <div className="card" style={{padding:'12px 14px'}}>
          <div style={{fontSize:9,fontWeight:700,letterSpacing:'0.12em',color:'var(--t3)'}}>MARKET HEALTH</div>
          <div className="stat" style={{marginTop:6}}>
            <span className={`stat-val ${data.breadth && data.breadth.market_health!=null ? (data.breadth.market_health>=60?'acid':data.breadth.market_health>=45?'gold':'rose') : 't2'}`} style={{fontSize:26}}>{data.breadth && data.breadth.market_health!=null ? data.breadth.market_health : '—'}</span>
            <span className="stat-key">/100 breadth blend</span>
          </div>
          <div className="note" style={{marginTop:4}}>{data.breadth && data.breadth.market_health!=null ? (data.breadth.market_health>=60?'Broad participation':data.breadth.market_health>=45?'Mixed tape':'Weak tape') : 'Run a scan'}</div>
        </div>
        <div className="card" style={{padding:'12px 14px'}}>
          <div style={{fontSize:9,fontWeight:700,letterSpacing:'0.12em',color:'var(--t3)'}}>TOP SECTOR</div>
          <div style={{fontSize:16,fontWeight:700,color:'var(--t0)',marginTop:6}}>{sectors && sectors.length ? sectors[0].sector : '—'}</div>
          <div className="note" style={{marginTop:4}}>{sectors && sectors.length ? `#${sectors[0].rank} · strength ${fmt(sectors[0].strength,0)} · ${sectors[0].count} stocks` : 'Run a scan'}</div>
        </div>
        <div className="card" style={{padding:'12px 14px'}}>
          <div style={{fontSize:9,fontWeight:700,letterSpacing:'0.12em',color:'var(--t3)'}}>CASH ALLOCATION</div>
          <div className="stat" style={{marginTop:6}}>
            <span className={`stat-val ${allocation && allocation.equity>=70?'acid':allocation && allocation.equity>=45?'gold':'rose'}`} style={{fontSize:26}}>{allocation ? allocation.equity : '—'}<span style={{fontSize:13}}>%</span></span>
            <span className="stat-key">suggested equity</span>
          </div>
          <div className="note" style={{marginTop:4}}>{allocation && allocation.equity>=70?'Risk-on regime':allocation && allocation.equity>=45?'Balanced stance':'Defensive stance'}</div>
        </div>
      </div>

      {data.failed_symbols && data.failed_symbols.length > 0 && (
        <div style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap',marginBottom:14,background:'rgba(255,110,97,0.07)',border:'1px solid rgba(255,110,97,0.35)',borderRadius:10,padding:'8px 12px'}}>
          <span style={{fontSize:11,fontWeight:700,color:'var(--rose)'}}>⚠ {data.failed_symbols.length}+ fetch failures this scan</span>
          {data.failed_symbols.slice(0,6).map(f=>(
            <span key={f.symbol+f.ts} style={{fontFamily:'var(--mono)',fontSize:9,color:'var(--t2)'}}>{f.symbol}<span style={{color:'var(--t3)'}}>·{f.source}</span></span>
          ))}
          <span className="note" style={{marginLeft:'auto'}}>Tracked per symbol — never silently dropped</span>
        </div>
      )}

      <div className="grid2">
        <div className="card">
          <div className="card-hdr"><span className="card-title">Market Regime</span><span className={`regime-chip regime-${regime.regime}`}>{regime.regime}</span></div>
          <div style={{display:'flex',gap:24,flexWrap:'wrap'}}>
            <div className="stat"><span className="stat-val" style={{fontSize:18}}>{fmt(regime.nifty,0)}</span><span className="stat-key">NIFTY 50</span></div>
            <div className="stat"><span className="stat-val" style={{fontSize:18}}>{fmt(regime.nifty_200dma,0)}</span><span className="stat-key">200-DMA {regime.above_200dma ? '· above ✓' : '· below ✗'}</span></div>
            <div className="stat"><span className="stat-val gold" style={{fontSize:18}}>{regime.vix != null ? Number(regime.vix).toFixed(1) : '—'}</span><span className="stat-key">India VIX</span></div>
            <div className="stat"><span className="stat-val" style={{fontSize:18}}>{regime.adx != null ? Number(regime.adx).toFixed(1) : '—'}</span><span className="stat-key">ADX</span></div>
          </div>
          <div className="note" style={{marginTop:12}}>{regime.reason}</div>
        </div>

        <div className="card">
          <div className="card-hdr"><span className="card-title">Suggested Cash Allocation</span></div>
          <div className="alloc">
            <div className="eq" style={{width:allocation.equity+'%'}}>EQUITY {allocation.equity}%</div>
            <div className="cs" style={{width:allocation.cash+'%'}}>CASH {allocation.cash}%</div>
          </div>
          <div className="note" style={{marginTop:12}}>{allocation.note}</div>
          <div className="status-line" style={{marginTop:14}}>
            <span className="pulse-dot"/> {scored} of {universe_size} stocks scored · {universe_tiers ? `core ${universe_tiers.core || 0} · discovery ${universe_tiers.discovery || 0}` : ''} {last_scan_at ? '· last scan ' + new Date(last_scan_at).toLocaleString() : '· no scan yet'}
          </div>
        </div>
      </div>

      <div className="card">

          <div style={{display:'flex',gap:10,flexWrap:'wrap'}}>
            {sectors.slice(0,8).map(s=>(
              <div key={s.sector} style={{flex:'1 1 140px',background:'var(--bg2)',border:'1px solid var(--wire)',borderRadius:10,padding:'10px 12px'}}>
                <div style={{fontWeight:600,color:'var(--t0)',fontSize:12}}>{s.sector}</div>
                <div style={{fontFamily:'var(--mono)',fontSize:10,color:'var(--t3)',marginTop:3}}>#{s.rank} · strength {fmt(s.strength,0)} · {s.count} stocks</div>

          </div>

      </div>

      <div className="card">
        <div className="card-hdr">
          <span className="card-title">Top Picks</span>
          <div style={{display:'flex',gap:8}}>
            <button className="btn-ghost" disabled={scanning} onClick={()=>runScan(false)}>{scanning ? 'Scanning…' : '⟳ Core Scan'}</button>
            <button className="btn" disabled={scanning} onClick={()=>runScan(true)}>{scanning ? 'Scanning…' : '⚡ Force refresh'}</button>
            <button className="btn-ghost" disabled={scanning} onClick={()=>runScan(false,'discovery')}>{scanning ? 'Scanning…' : '🧭 Discovery Scan'}</button>
          </div>
        </div>
        {scanResult && (
          <div className="note" style={{marginBottom:10}}>
            {scanResult.error ? `Scan failed: ${scanResult.error}` :
              `✓ [${scanResult.tier || 'core'}] ${scanResult.scored}/${scanResult.scanned} scored in ${scanResult.duration_sec}s · ${scanResult.fundamentals} fundamentals · regime ${scanResult.regime}`}
          </div>
        )}
        {top_picks.length === 0 ? (
          <Empty icon="📡" text="No scan data yet — run a scan to populate the dashboard."><button className="btn" onClick={()=>runScan(false)}>Run first scan</button></Empty>
        ) : (
          <div className="tbl-wrap">
            <table>
              <thead><tr><th>#</th><th>Symbol</th><th>Sector</th><th>Bucket</th><th className="num">Price</th><th className="num">Day %</th><th className="num">Score</th><th className="num">Δ vs Last Scan</th></tr></thead>
              <tbody>
                {top_picks.map((p,i)=>(
                  <tr key={p.symbol}>
                    <td style={{color:'var(--t3)',fontFamily:'var(--mono)'}}>{i+1}</td>
                    <td><span style={{color:'var(--t0)',fontWeight:600}}>{p.symbol.replace('.NS','')}</span></td>
                    <td style={{color:'var(--t2)'}}>{p.sector}</td>
                    <td><Bucket b={p.mb_bucket}/></td>
                    <td className="num">{fmtRs(p.price)}</td>
                    <td className={`num ${p.change_pct >= 0 ? 'up' : 'dn'}`}>{pct(p.change_pct)}</td>
                    <td className="num"><ScoreCell score={p.score}/></td>
                    <td className="num"><Delta v={p.score_delta}/></td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
      </div>
    </div>
  );
}

/* ── SCREENER ────────────────────────────────────────────────────────── */
function Screener(){
  const [rows,setRows] = useState(null);
  const [err,setErr] = useState(null);
  const [explain,setExplain] = useState(null);
  const [f,setF] = useState({min_score:'',min_roe:'',min_roce:'',min_growth:'',max_pe:'',min_conf:'',bucket:'',sort:'opp'});
  const [loading,setLoading] = useState(false);

  const load = useCallback(()=>{
    setLoading(true);
    const q = new URLSearchParams();
    if (f.min_score) q.set('min_score', f.min_score);
    if (f.min_roe) q.set('min_roe', f.min_roe);
    if (f.min_roce) q.set('min_roce', f.min_roce);
    if (f.min_growth) q.set('min_growth', f.min_growth);
    if (f.max_pe) q.set('max_pe', f.max_pe);
    if (f.min_conf) q.set('min_conf', f.min_conf);
    if (f.bucket) q.set('bucket', f.bucket);
    q.set('sort', f.sort);
    j('/api/scores?'+q.toString()).then(setRows).catch(e=>setErr(e.message)).finally(()=>setLoading(false));
  },[f]);
  useEffect(load,[load]);

  const set = k => e => setF({...f,[k]:e.target.value});
  return (
    <div className="wrap anim">
      <div><div className="screen-title">Screener</div><div className="screen-sub">Filter the universe by fundamentals</div></div>
      <div className="card">
        <div className="filter-row">
          <label>Min Score<input type="number" placeholder="0" value={f.min_score} onChange={set('min_score')}/></label>
          <label>Min ROE %<input type="number" placeholder="0" value={f.min_roe} onChange={set('min_roe')}/></label>
          <label>Min ROCE %<input type="number" placeholder="0" value={f.min_roce} onChange={set('min_roce')}/></label>
          <label>Min Growth %<input type="number" placeholder="0" value={f.min_growth} onChange={set('min_growth')}/></label>
          <label>Max PE<input type="number" placeholder="∞" value={f.max_pe} onChange={set('max_pe')}/></label>
          <label>Min Conf %<input type="number" placeholder="0" value={f.min_conf} onChange={set('min_conf')}/></label>
          <label>Bucket
            <select value={f.bucket} onChange={set('bucket')}>
              <option value="">All</option>
              <option value="MULTIBAGGER">Multibagger</option>
              <option value="STRONG">Strong Candidate</option>
              <option value="EMERGING">Emerging</option>
              <option value="WATCHLIST">Watchlist</option>
            </select>
          </label>
          <label>Sort
            <select value={f.sort} onChange={set('sort')}>
              <option value="opp">Opportunity</option><option value="score">Score</option><option value="roe">ROE</option><option value="growth">Growth</option><option value="pe">PE</option>
            </select>
          </label>
        </div>
      </div>
      <div className="card">
        {err && <Empty icon="⚠️" text={err}/>}
        {!err && !rows && <Loader/>}
        {rows && rows.length === 0 && <Empty icon="🔍" text="No stocks match these filters."/>}
        {rows && rows.length > 0 && (
          <div className="tbl-wrap">
            <table>
              <thead><tr>
                <th>Rank</th><th>Symbol</th><th>Sector</th><th className="num">Opp</th><th className="num">Score</th><th>Bucket</th>
                <th className="num">Δ Score</th><th className="num">ROE %</th><th className="num">ROCE %</th><th className="num">Growth %</th>
                <th className="num">PE</th><th className="num">Mkt Cap</th><th className="num">Trend</th>
              </tr></thead>
              <tbody>
                {rows.map(r=>(
                  <tr key={r.symbol} style={{cursor:'pointer'}} onClick={()=>setExplain(e=>e===r.symbol?null:r.symbol)}>
                    <td style={{color:'var(--t3)',fontFamily:'var(--mono)'}}>{r.rank}</td>
                    <td><span style={{color:'var(--t0)',fontWeight:600}}>{r.symbol.replace('.NS','')}</span></td>
                    <td style={{color:'var(--t2)'}}>{r.sector || '—'}</td>
                    <td className="num"><ScoreCell score={r.opp_score}/></td>
                    <td className="num"><ScoreCell score={r.score}/></td>
                    <td><Bucket b={r.mb_bucket}/></td>
                    <td className="num"><Delta v={r.score_delta}/></td>
                    <td className="num">{fmt(r.roe,1)}</td>
                    <td className="num">{fmt(r.roce,1)}</td>
                    <td className={`num ${r.sales_growth > 0 ? 'up' : 'dn'}`}>{fmt(r.sales_growth,1)}</td>
                    <td className="num">{fmt(r.pe,1)}</td>
                    <td className="num">{fmtCr(r.market_cap)}</td>
                    <td className="num">{r.trend_ok ? <span className="up">✓</span> : <span style={{color:'var(--t3)'}}>—</span>}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
      </div>
      {explain && <Explain symbol={explain} onClose={()=>setExplain(null)}/>}
    </div>
  );
}

/* ── EXPLAINABILITY DRAWER ───────────────────────────────────────────── */
const FACTOR_LABELS = [['quality','Quality'],['growth','Growth'],['momentum','Momentum'],['valuation','Valuation'],['risk','Risk'],['revision','Revision'],['rs_boost','RS Boost'],['sector_boost','Sector']];
function Explain({symbol,onClose}){
  const [d,setD] = useState(null);
  const [err,setErr] = useState(null);
  useEffect(()=>{ setD(null); setErr(null); j('/api/explain/'+symbol).then(setD).catch(e=>setErr(e.message)); },[symbol]);
  const hist = d ? (d.score_history||[]) : [];
  const pts = hist.length > 1 ? hist.map((v,i)=>`${(i/(hist.length-1))*250},${40-(Math.max(0,Math.min(100,v))/100)*34}`).join(' ') : '';
  return (
    <>
      <div style={{position:'fixed',inset:0,background:'rgba(4,10,16,0.6)',zIndex:60}} onClick={onClose}/>
      <div className="anim" style={{position:'fixed',top:0,right:0,bottom:0,width:390,maxWidth:'94vw',background:'var(--bg1)',borderLeft:'1px solid var(--wire2)',zIndex:61,padding:18,overflowY:'auto',display:'flex',flexDirection:'column',gap:12}}>
        {err ? <Empty icon="⚠️" text={err}/> : !d ? <Loader/> : (
          <>
            <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',gap:10}}>
              <div>
                <div style={{fontSize:19,fontWeight:700,color:'var(--t0)',letterSpacing:'0.02em'}}>{symbol.replace('.NS','')}</div>
                <div style={{fontSize:9,color:'var(--t3)',marginTop:2}}>{d.name||''}{d.sector ? ' · '+d.sector : ''}{d.market_cap!=null ? ' · '+fmtCr(d.market_cap) : ''}</div>
              </div>
              <button className="btn-ghost" style={{padding:'2px 9px'}} onClick={onClose}>✕</button>
            </div>
            <div style={{display:'flex',alignItems:'center',gap:16,flexWrap:'wrap'}}>
              <div>
                <div style={{fontFamily:'var(--mono)',fontSize:30,fontWeight:700,color:SCORE_COLOR(d.score)}}>{fmt(d.score,0)}</div>
                <div style={{fontSize:8,color:'var(--t3)',letterSpacing:'0.12em'}}>COMPOSITE</div>
              </div>
              <div style={{display:'flex',flexDirection:'column',gap:5}}>
                <div style={{display:'flex',gap:8,alignItems:'center'}}><span style={{fontSize:8,color:'var(--t3)'}}>RANK</span><span style={{fontFamily:'var(--mono)',fontSize:12,fontWeight:600,color:'var(--t1)'}}>#{d.rank!=null?d.rank:'—'}</span>{d.mb_bucket && <Bucket b={d.mb_bucket}/>}</div>
                <div style={{display:'flex',gap:8,alignItems:'center'}}><span style={{fontSize:8,color:'var(--t3)'}}>Δ SCORE</span><Delta v={d.score_delta}/></div>
                <div style={{display:'flex',gap:8,alignItems:'center'}}><span style={{fontSize:8,color:'var(--t3)'}}>REGIME</span><span className={`regime-chip regime-${d.regime}`}>{d.regime||'—'}</span></div>
              </div>
              <div style={{marginLeft:'auto'}}><span style={{fontSize:8,color:'var(--t3)'}}>CONF</span><div style={{marginTop:3}}><ConfCell v={d.data_confidence}/></div></div>
            </div>
            <div className="card" style={{padding:'10px 12px'}}>
              <div style={{fontSize:9,fontWeight:700,letterSpacing:'0.12em',color:'var(--t3)'}}>FACTOR CONTRIBUTIONS</div>
              <div style={{display:'flex',flexDirection:'column',gap:7,marginTop:8}}>
                {FACTOR_LABELS.map(([k,label])=>{
                  const v = d.contributions ? d.contributions[k] : null;
                  if (v == null || isNaN(v)) return null;
                  const c = v >= 0 ? 'var(--acid)' : 'var(--rose)';
                  return (
                    <div key={k} style={{display:'flex',alignItems:'center',gap:8}}>
                      <span style={{fontFamily:'var(--mono)',fontSize:9,color:'var(--t2)',width:74}}>{label}</span>
                      <div style={{flex:1,height:7,background:'var(--bg0)',borderRadius:4,overflow:'hidden'}}>
                        <div style={{height:'100%',width:Math.min(100,Math.abs(v))+'%',background:c,borderRadius:4}}/>
                      </div>
                      <span style={{fontFamily:'var(--mono)',fontSize:10,fontWeight:600,color:c,width:44,textAlign:'right'}}>{v>0?'+':''}{Number(v).toFixed(1)}</span>
                    </div>
                  );
                })}
              </div>
            </div>
            <div style={{display:'flex',flexDirection:'column',gap:6}}>
              {d.best_positive && <div style={{fontSize:10,color:'var(--acid)',fontFamily:'var(--mono)'}}>▲ {d.best_positive.label} <span style={{color:'var(--t3)'}}>· {d.best_positive.value>0?'+':''}{Number(d.best_positive.value).toFixed(1)} pts</span></div>}
              {d.best_negative && <div style={{fontSize:10,color:'var(--rose)',fontFamily:'var(--mono)'}}>▼ {d.best_negative.label} <span style={{color:'var(--t3)'}}>· {Number(d.best_negative.value).toFixed(1)} pts</span></div>}
            </div>
            {hist.length > 1 && (
              <div className="card" style={{padding:'10px 12px'}}>
                <div style={{fontSize:9,fontWeight:700,letterSpacing:'0.12em',color:'var(--t3)'}}>SCORE TRAIL · LAST {hist.length} SCANS</div>
                <svg width="100%" height="46" viewBox="0 0 250 44" preserveAspectRatio="none" style={{marginTop:8}}>
                  <polyline points={pts} fill="none" stroke="var(--acid)" strokeWidth="2"/>
                </svg>
                <div style={{display:'flex',justifyContent:'space-between',fontFamily:'var(--mono)',fontSize:8,color:'var(--t3)'}}>
                  <span>{Math.min(...hist)}</span><span>{Math.max(...hist)}</span>
                </div>
              </div>
            )}
          </>
        )}
      </div>
    </>
  );
}

  const [mbs,setMbs] = useState(null);
  const [err,setErr] = useState(null);
  const [explain,setExplain] = useState(null);
  useEffect(()=>{
    j('/api/picks?limit=20').then(setPicks).catch(e=>setErr(e.message));
    j('/api/mb-candidates?limit=100').then(setMbs).catch(()=>{});

  return (
    <div className="wrap anim">
      <div><div className="screen-title">Elite Picks</div><div className="screen-sub">Top 20 by institutional score · click a row for factor attribution</div></div>
      <div className="card">
        {picks.length === 0 ? <Empty icon="📡" text="Run a scan first."/> : (
          <div className="tbl-wrap">

  );
}

/* ── RESEARCH (FACTOR + REGIME INTELLIGENCE) ─────────────────────────── */
function Research(){
  const [fdata,setFdata] = useState(null);
  const [rdata,setRdata] = useState(null);
  const [revs,setRevs] = useState([]);
  const [err,setErr] = useState(null);
  const load = useCallback(()=>{
    Promise.all([j('/api/research/factors'), j('/api/research/regimes'), j('/api/revisions?limit=80')])
      .then(([f,r,v])=>{ setFdata(f); setRdata(r); setRevs(v||[]); })
      .catch(e=>setErr(e.message));
  },[load]);
  useEffect(load,[load]);
  if (err && !fdata) return <Empty icon="⚠️" text={err}><button className="btn-ghost" onClick={load}>Retry</button></Empty>;
  if (!fdata || !rdata) return <Loader/>;
  const factors = fdata.factors || [];
  const decay = fdata.alpha_decay || [];
  const regimes = rdata.regimes || [];
  const counts = rdata.snapshot_counts || {};
  const icColor = ic => ic >= 0.15 ? 'var(--acid)' : ic >= 0.05 ? 'var(--gold)' : 'var(--rose)';
  return (
    <div className="wrap anim">
      <div><div className="screen-title">Research</div><div className="screen-sub">Which factors actually predict returns · per regime</div></div>

      <div className="card">
        <div className="card-hdr"><span className="card-title">Factor IC</span><span className="note">Spearman IC vs realized 30d forward returns · ranked</span></div>
        {factors.length === 0 ? <div className="note">No measured signals yet — IC accrues after consecutive scans with elapsed price history.</div> : (
          <div className="tbl-wrap">
            <table>
              <thead><tr><th>#</th><th>Factor</th><th className="num">Avg IC</th><th className="num">Last IC</th><th className="num">Signals</th></tr></thead>
              <tbody>
                {factors.map((f,i)=>(
                  <tr key={f.factor}>
                    <td style={{color:'var(--t3)',fontFamily:'var(--mono)'}}>{i+1}</td>
                    <td><span style={{textTransform:'capitalize',fontWeight:600}}>{f.factor.replace('_',' ')}</span></td>

                    <td className="num" style={{fontFamily:'var(--mono)'}}>{f.last_ic!=null ? Number(f.last_ic).toFixed(3) : '—'}</td>
                    <td className="num" style={{fontFamily:'var(--mono)',color:'var(--t3)'}}>{f.n}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
      </div>

      <div className="grid2">
        <div className="card">
          <div className="card-hdr"><span className="card-title">Alpha Decay</span><span className="note">avg forward return after signals</span></div>
          {decay.length === 0 ? <div className="note">No measured signals yet — forward returns accrue as elapsed history builds.</div> : (
            <div style={{display:'flex',gap:10,flexWrap:'wrap'}}>
              {decay.map(h=>(
                <div key={h.horizon_days} style={{flex:'1 1 110px',background:'var(--bg2)',border:'1px solid var(--wire)',borderRadius:10,padding:'10px 12px'}}>
                  <div style={{fontFamily:'var(--mono)',fontSize:9,color:'var(--t3)'}}>{h.horizon_days}d horizon</div>
                  <div className={`num ${(h.avg_return_pct||0)>=0?'up':'dn'}`} style={{fontWeight:700,fontSize:15}}>{h.avg_return_pct!=null ? pct(h.avg_return_pct) : '—'}</div>
                  <div style={{fontFamily:'var(--mono)',fontSize:9,color:'var(--t3)',marginTop:3}}>hit {h.hit_rate_pct!=null ? fmt(h.hit_rate_pct,0)+'%' : '—'} · n={h.n!=null?h.n:0}</div>
                </div>
              ))}
            </div>
          )}
        </div>

        <div className="card">
          <div className="card-hdr"><span className="card-title">Regime Performance</span><span className="note">best factor per regime</span></div>
          {regimes.length === 0 ? <div className="note">No regime-split IC yet — accrues with consecutive scans.</div> : (
            <div style={{display:'flex',flexDirection:'column',gap:8}}>

                <div key={rg.regime} style={{background:'var(--bg2)',border:'1px solid var(--wire)',borderRadius:10,padding:'10px 12px'}}>
                  <div style={{display:'flex',alignItems:'center',gap:8,justifyContent:'space-between'}}>
                    <span className={`regime-chip regime-${rg.regime}`}>{rg.regime}</span>
                    <span style={{fontFamily:'var(--mono)',fontSize:9,color:'var(--t3)'}}>{counts[rg.regime]!=null?counts[rg.regime]:0} snapshots</span>
                  </div>
                  <div style={{display:'flex',gap:6,flexWrap:'wrap',marginTop:8}}>
                    {Object.entries(rg.factors||{}).map(([k,v])=>(
                      <span key={k} style={{fontFamily:'var(--mono)',fontSize:9,padding:'2px 7px',borderRadius:4,background:k===rg.best_factor?'var(--acid-d)':'var(--bg0)',color:k===rg.best_factor?'var(--acid)':'var(--t2)',fontWeight:k===rg.best_factor?700:400}}>{k} {Number(v).toFixed(2)}</span>
                    ))}
                  </div>
                  {rg.best_factor && <div style={{fontSize:9,color:'var(--acid)',fontFamily:'var(--mono)',marginTop:6}}>▲ best factor: {rg.best_factor}</div>}

      <div className="card">
        <div className="card-hdr"><span className="card-title">Earnings Revisions</span><span className="note">reported-quarter momentum · revenue/PAT qoq · free-data proxy, no analyst estimates</span></div>
